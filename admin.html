<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة أمنية - الإدارة</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1,h2,h3{color:#0B3D91;margin:0 0 8px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}
button{background:#0B3D91;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;margin:4px 0;font-size:15px}
.doc{background:#f8f9ff;border:1px solid #dde;padding:12px;border-radius:10px;margin:8px 0}
.small{font-size:13px;color:#666}
.green{background:#25D366}
.red{background:#c00}
</style>
</head>
<body>

<div id="login" class="card">
  <h1>👩‍💼 أهلاً يا أمنية</h1>
  <p>دي لوحة الإدارة بتاعتك انتي بس</p>
  <input id="pass" type="password" placeholder="اكتبي باسورد الإدارة">
  <button onclick="login()">دخول الإدارة</button>
  <p class="small">الباسورد: 9999</p>
</div>

<div id="panel" style="display:none">
  <div class="card">
    <h1>لوحة تحكم أمنية</h1>
    <p class="small">من هنا بتديري السيستم كله</p>
    <p><b>عدد الدكاترة:</b> <span id="count">0</span></p>
    <button onclick="logout()" class="red" style="width:auto;padding:8px 16px">خروج</button>
  </div>

  <div class="card">
    <h3>➕ أضيفي دكتور جديد - أول شهر مجاني</h3>
    <input id="dName" placeholder="اسم الدكتور - مثال: أحمد">
    <input id="dSpec" placeholder="التخصص - مثال: أسنان">
    <input id="dPass" placeholder="باسورد الدكتور - مثال: 1234">
    <button onclick="addDoctor()">إضافة الدكتور + اعملي لينكه</button>
  </div>

  <div class="card">
    <h3>👨‍⚕️ الدكاترة عندك</h3>
    <div id="list"></div>
  </div>
</div>

<script>
function login(){
  if(document.getElementById('pass').value==='9999'){
    sessionStorage.setItem('omnia_admin','ok'); show();
  } else alert('الباسورد غلط');
}
function logout(){ sessionStorage.removeItem('omnia_admin'); location.reload(); }
function show(){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  render();
}
function getDocs(){ return JSON.parse(localStorage.getItem('omnia_doctors')||'[]'); }
function addDoctor(){
  let n=document.getElementById('dName').value.trim();
  let s=document.getElementById('dSpec').value.trim();
  let p=document.getElementById('dPass').value.trim();
  if(!n||!p) return alert('اكتبي اسم الدكتور والباسورد');
  let d=getDocs();
  let code=n.replace(/\s+/g,'-');
  let end=new Date(); end.setDate(end.getDate()+30);
  d.push({name:n,spec:s,pass:p,code:code,end:end.toLocaleDateString('ar-EG')});
  localStorage.setItem('omnia_doctors',JSON.stringify(d));
  document.getElementById('dName').value='';
  document.getElementById('dSpec').value='';
  document.getElementById('dPass').value='';
  render();
  alert('اتضاف ✅ شهره المجاني لحد '+end.toLocaleDateString('ar-EG'));
}
function render(){
  let d=getDocs();
  document.getElementById('count').textContent=d.length;
  if(!d.length){ document.getElementById('list').innerHTML='لسه مفيش دكاترة، ضيفي أول دكتور فوق'; return; }
  document.getElementById('list').innerHTML=d.map((x,i)=>{
    let link=location.origin+location.pathname.replace('admin.html','v2.html')+'?doctor='+encodeURIComponent(x.code);
    let waMsg=encodeURIComponent('أهلاً دكتور '+x.name+' 🌸\nده لينك السيستم بتاع حضرتك:\n'+link+'\nالباسورد: '+x.pass+'\nأول شهر مجاني لحد '+x.end+'\nنزّل التطبيق من زرار ⬇️ نزّل التطبيق');
    return `<div class="doc">
      <b>${x.name}</b> - ${x.spec||''}<br>
      <span class="small">باسورد: ${x.pass} | مجاني لحد: ${x.end}</span><br><br>
      <input value="${link}" readonly>
      <button onclick="navigator.clipboard.writeText('${link}');alert('لينك الدكتور اتنسخ ✅')">📋 نسخ لينك الدكتور</button>
      <button class="green" onclick="window.open('https://wa.me/?text=${waMsg}','_blank')">💬 ابعتي له على الواتساب</button>
      <button class="red" onclick="delDoc(${i})">حذف الدكتور</button>
    </div>`;
  }).join('');
}
function delDoc(i){
  if(!confirm('متأكدة تحذفي الدكتور ده؟')) return;
  let d=getDocs(); d.splice(i,1);
  localStorage.setItem('omnia_doctors',JSON.stringify(d));
  render();
}
if(sessionStorage.getItem('omnia_admin')==='ok') show();
</script>
  <style>
#adminInstall{
  position:fixed!important; bottom:15px!important; right:15px!important; left:15px!important;
  z-index:9999!important; background:#25D366!important; color:#fff!important;
  border:none!important; padding:15px!important; border-radius:25px!important;
  font-size:16px!important; font-weight:bold!important;
  box-shadow:0 4px 12px rgba(0,0,0,.3)!important;
}
</style>
<button id="adminInstall">⬇️ نزّلي لوحة أمنية على الشاشة</button>
<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
document.getElementById('adminInstall').onclick = async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert('عشان تنزلي لوحة أمنية على الشاشة:\n\nلو آيفون: دوسي على زرار المشاركة تحت ⬆️ > إضافة إلى الشاشة الرئيسية > إضافة\n\nلو أندرويد: دوسي على ⋮ فوق > إضافة إلى الشاشة الرئيسية > تثبيت');
  }
};
</script>
</body>
</html>

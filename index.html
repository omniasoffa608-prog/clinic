<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عيادة لطب الأسنان</title><style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#EAF6FF;color:#0A2540}
header{background:#0A2540;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;gap:8px}
.layout{display:flex;min-height:100vh}aside{width:260px;background:#0A2540;color:#fff;padding:16px;flex-shrink:0}
aside button{display:block;width:100%;background:transparent;border:0;color:#fff;padding:13px 14px;border-radius:12px;cursor:pointer;font-size:16px;text-align:right}
aside button.active{background:#A9D6F0;color:#0A2540;font-weight:800}main{flex:1;padding:20px;min-width:0;max-width:1100px;margin:0 auto;width:100%}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(10,37,64,.08)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid #C9E6F7;border-radius:12px;margin:7px 0;background:#F7FBFF;font-size:16px;color:#0A2540}
.btn{background:#0A2540;color:#fff;border:0;padding:13px;border-radius:12px;width:100%;font-weight:800;cursor:pointer;font-size:16px}
.btn2{background:#A9D6F0;color:#0A2540;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.btnG{background:#16a34a;color:#fff;border:0;padding:13px;border-radius:12px;width:100%;font-weight:800;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:13px 10px;border-bottom:1px solid #EAF6FF;text-align:right;font-size:15px}
.tableWrap{overflow-x:auto}
.tooth{width:42px;height:42px;border-radius:50%;border:2px solid #0A2540;background:#fff;cursor:pointer}.tooth.filling{background:#3b82f6;color:#fff}.tooth.extraction{background:#ef4444;color:#fff}.tooth.treatment{background:#f59e0b;color:#fff}
.label{font-size:13px;color:#64748b}.low{color:#dc2626;font-weight:700}.exp{color:#dc2626;font-weight:700;background:#fee2e2;padding:4px 8px;border-radius:20px;font-size:12px}
.menuBtn{display:none;background:#A9D6F0;color:#0A2540;border:0;padding:8px 13px;border-radius:10px;font-size:21px;font-weight:800;cursor:pointer}
@media(max-width:900px){.layout{flex-direction:column}.menuBtn{display:block}aside{width:100%;display:none;padding:12px}aside.show{display:block}main{padding:12px}.grid3,.grid2{grid-template-columns:1fr}.tooth{width:36px;height:36px}}
</style></head><body><div id="app"></div>
<script>
var _params=new URLSearchParams(location.search);
var IS_ADMIN=_params.get('admin')=='1';
var ADMIN_PASS='1111';
var DOCTOR_ID=(_params.get('d')||localStorage.getItem('lastDoctor')||'barakat').toString().toLowerCase().trim().replace(/\s+/g,'-')||'barakat';
if(!IS_ADMIN) localStorage.setItem('lastDoctor',DOCTOR_ID);
function _docKey(k){return 'barakat_'+DOCTOR_ID+'_'+k}
function _getDoc(k,fallback){var v=localStorage.getItem(_docKey(k)); if(v) return JSON.parse(v); if(DOCTOR_ID==='barakat'){var old=localStorage.getItem('barakat_'+k); if(old) return JSON.parse(old);} return JSON.parse(fallback)}
var doctorsRegistry=JSON.parse(localStorage.getItem('barakat_all_doctors')||'{}');
function saveRegistry(){localStorage.setItem('barakat_all_doctors',JSON.stringify(doctorsRegistry))}
function getDoctorInfo(id){
  if(!doctorsRegistry[id]){
    doctorsRegistry[id]={id:id,name:id,createdAt:Date.now(),expiresAt:Date.now()+30*24*60*60*1000,active:true,passDoc:'12321',passSec:'2222'};
    saveRegistry();
  }
  if(!doctorsRegistry[id].passDoc) doctorsRegistry[id].passDoc='12321';
  if(!doctorsRegistry[id].passSec) doctorsRegistry[id].passSec='2222';
  return doctorsRegistry[id];
}
var myDoctor=getDoctorInfo(DOCTOR_ID);
function isExpired(){ if(!myDoctor.active) return true; return Date.now()>myDoctor.expiresAt; }
function daysLeft(){ return Math.max(0,Math.ceil((myDoctor.expiresAt-Date.now())/86400000)); }
function doctorLink(id){return location.origin+location.pathname+'?d='+encodeURIComponent(id)}
</script>
<script>
var lang='ar',role=null,page='home',sel=null;
var _clinicRaw = localStorage.getItem(_docKey('clinic'));
var clinic;
if(_clinicRaw){ clinic = JSON.parse(_clinicRaw); }
else if(DOCTOR_ID==='barakat'){
  clinic = JSON.parse(localStorage.getItem('barakat_clinic')||'{"name":"عيادة بركات لطب الأسنان","doctor":"د. كريم بركات","doctorTitle":"أخصائي طب وجراحة الفم والأسنان","secName":"","passDoc":"12321","passSec":"2222"}');
} else {
  clinic = {name: myDoctor.name || DOCTOR_ID, doctor: myDoctor.name || DOCTOR_ID, doctorTitle:'أخصائي طب وجراحة الفم والأسنان', secName:'', passDoc: myDoctor.passDoc||'12321', passSec: myDoctor.passSec||'2222'};
  localStorage.setItem(_docKey('clinic'), JSON.stringify(clinic));
}
if(myDoctor.passDoc) clinic.passDoc = myDoctor.passDoc;
if(myDoctor.passSec) clinic.passSec = myDoctor.passSec;
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';render()}
var patients=_getDoc('patients','[]');
var stock=_getDoc('stock','[]');
var manualExps=_getDoc('exps','[]');
var attendance=_getDoc('att','[]');
var waitList=_getDoc('wait','[]');
function save(){localStorage.setItem(_docKey('patients'),JSON.stringify(patients));localStorage.setItem(_docKey('stock'),JSON.stringify(stock));localStorage.setItem(_docKey('exps'),JSON.stringify(manualExps));localStorage.setItem(_docKey('wait'),JSON.stringify(waitList));localStorage.setItem(_docKey('att'),JSON.stringify(attendance));localStorage.setItem(_docKey('clinic'),JSON.stringify(clinic));saveRegistry();}
function showLocked(){
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:460px;margin:50px auto;text-align:center"><div style="font-size:60px">🔒</div><h2>اشتراكك خلص</h2><p>الشهر المجاني بتاع الدكتور <b>${DOCTOR_ID}</b> خلص.<br>كلم الإدارة عشان تجدد الاشتراك.</p><a href="https://wa.me/201159534097" target="_blank"><button class="btnG">كلم الإدارة واتساب</button></a><br><br><button class="btn2" onclick="location.href=location.pathname+'?admin=1'">دخول الإدارة</button></div>`;
}
</script>
<script>
let adminLogged=false;
function renderAdmin(){
  if(!adminLogged){
    document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:50px auto;text-align:center"><div style="font-size:48px">👑</div><h2>لوحة تحكم الإدارة</h2><input id="adminPw" type="password" placeholder="كلمة سر الإدارة"><button class="btn" onclick="checkAdmin()">دخول</button><p class="label">كلمة السر: 1111</p></div>`;
    return;
  }
  let list=Object.values(doctorsRegistry);
  let html=`<header><div><b>إدارة السيستم</b></div><button class="btn2" onclick="location.href=location.pathname">رجوع لعيادتي</button></header><main><div class="card"><h3>إضافة دكتور جديد</h3><input id="newDocId" placeholder="اسم الدكتور في اللينك - مثال: dr-ahmed"><input id="newDocName" placeholder="اسم العيادة"><input id="newPassDoc" placeholder="رقم سري الدكتور - مثال: 5555"><input id="newPassSec" placeholder="رقم سري السكرتيرة - مثال: 6666"><button class="btn" onclick="addDoctor()">إنشاء لينك + شهر مجاني</button></div><div class="card"><h3>الدكاترة</h3>`;
  list.forEach(d=>{
    let left=Math.max(0,Math.ceil((d.expiresAt-Date.now())/86400000));
    html+=`<div style="border:1px solid #EAF6FF;border-radius:12px;padding:12px;margin-bottom:10px"><b>${d.name||d.id}</b> (${d.id})<br><span class="label">${left} يوم فاضل | ${d.active?'شغال':'مقفول'}</span><br>دكتور: <b>${d.passDoc||'12321'}</b> | سكرتيرة: <b>${d.passSec||'2222'}</b><br><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn2" onclick="renewDoctor('${d.id}')">تجديد شهر</button><button class="btn2" onclick="toggleDoctor('${d.id}')">${d.active?'قفل':'فتح'}</button><button class="btn2" onclick="copyLink('${d.id}')">نسخ اللينك</button><button class="btn2" onclick="fixDoctorClinic('${d.id}')">إصلاح الاسم</button><button class="btn2" onclick="editDoctorPass('${d.id}')">تغيير الرقم السري</button><button class="btn2" onclick="deleteDoctor('${d.id}')">حذف</button></div><input readonly value="${doctorLink(d.id)}" onclick="this.select()"></div>`;
  });
  html+=`</div></main>`;
  document.getElementById('app').innerHTML=html;
}
function checkAdmin(){ if(document.getElementById('adminPw').value==ADMIN_PASS){adminLogged=true;renderAdmin()}else alert('غلط') }
function addDoctor(){ let id=document.getElementById('newDocId').value.trim().toLowerCase().replace(/\s+/g,'-'); let nm=document.getElementById('newDocName').value.trim()||id; let pd=document.getElementById('newPassDoc').value.trim()||'12321'; let ps=document.getElementById('newPassSec').value.trim()||'2222'; if(!id){alert('اكتبي اسم الدكتور');return} if(doctorsRegistry[id]){alert('موجود بالفعل');return} doctorsRegistry[id]={id:id,name:nm,createdAt:Date.now(),expiresAt:Date.now()+30*86400000,active:true,passDoc:pd,passSec:ps}; saveRegistry(); localStorage.setItem('barakat_'+id+'_clinic',JSON.stringify({name:nm,doctor:nm,doctorTitle:'أخصائي طب وجراحة الفم والأسنان',secName:'',passDoc:pd,passSec:ps})); renderAdmin(); alert('اتعمل! رقم الدكتور: '+pd); }
function fixDoctorClinic(id){ let d=doctorsRegistry[id]; let fixed={name:d.name,doctor:d.name,doctorTitle:'أخصائي طب وجراحة الفم والأسنان',secName:'',passDoc:d.passDoc||'12321',passSec:d.passSec||'2222'}; localStorage.setItem('barakat_'+id+'_clinic',JSON.stringify(fixed)); if(id===DOCTOR_ID) clinic=fixed; alert('اتصلح الاسم بقى: '+d.name); renderAdmin(); }
function editDoctorPass(id){ let d=doctorsRegistry[id]; let nd=prompt('رقم سري الدكتور الجديد',d.passDoc||'12321'); if(nd==null) return; let ns=prompt('رقم سري السكرتيرة الجديد',d.passSec||'2222'); if(ns==null) return; d.passDoc=nd.trim()||'12321'; d.passSec=ns.trim()||'2222'; saveRegistry(); let cur=JSON.parse(localStorage.getItem('barakat_'+id+'_clinic')||'{}'); cur.passDoc=d.passDoc; cur.passSec=d.passSec; localStorage.setItem('barakat_'+id+'_clinic',JSON.stringify(cur)); alert('اتغير'); renderAdmin(); }
function renewDoctor(id){ doctorsRegistry[id].expiresAt=Math.max(Date.now(),doctorsRegistry[id].expiresAt)+30*86400000; doctorsRegistry[id].active=true; saveRegistry(); renderAdmin(); }
function toggleDoctor(id){ doctorsRegistry[id].active=!doctorsRegistry[id].active; saveRegistry(); renderAdmin(); }
function deleteDoctor(id){ if(confirm('متأكدة تحذفي '+id+' ؟')){delete doctorsRegistry[id]; localStorage.removeItem('barakat_'+id+'_clinic'); saveRegistry(); renderAdmin();} }
function copyLink(id){ let link=doctorLink(id); if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>alert('اتنسخ '+link)); else prompt('انسخي اللينك:',link); }
function login(){
  if(IS_ADMIN){renderAdmin();return}
  if(isExpired()){showLocked();return}
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><div style="font-size:48px">🦷</div><h2>${clinic.name}</h2><h3>${clinic.doctor}</h3><p class="label">${clinic.doctorTitle}</p><p class="label">فاضل ${daysLeft()} يوم</p><input id="pw" type="password" placeholder="كلمة السر"><button class="btn" onclick="check()">دخول</button></div>`;
}
function check(){let v=document.getElementById('pw').value;if(v==clinic.passDoc){role='doctor';page='home';render()}else if(v==clinic.passSec){role='sec';page='home';render()}else alert('كلمة سر غلط')}
function go(p){if(p=='settings'&&role!='doctor'){alert('الإعدادات للدكتور بس');return}page=p;render()}
function menu(){let m=[['home','🏠 الرئيسية'],['patients','👥 المرضى'],['appoint','📅 المواعيد'],['stock','📦 المخزون']];if(role=='doctor')m.push(['reports','📊 التقارير'],['settings','⚙️ الإعدادات']);m.push(['waiting','⏳ قائمة الانتظار']);return m.map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+`<button onclick="role=null;login()">🚪 تسجيل الخروج</button>`}
function render(){if(IS_ADMIN){renderAdmin();return}if(isExpired()){showLocked();return}if(!role){login();return}let content='';if(page=='home')content=home();else if(page=='patients')content=patientsPage();else if(page=='appoint')content=appointPage();else if(page=='stock')content=stockPage();else if(page=='reports')content=reportsPage();else if(page=='settings')content=settingsPage();else if(page=='waiting')content=waitingPage();else content=home();document.getElementById('app').innerHTML=`<header><button class="menuBtn" onclick="document.querySelector('aside').classList.toggle('show')">☰</button><div><b>🦷 ${clinic.name}</b><br><small>${clinic.doctor} | فاضل ${daysLeft()} يوم</small></div><div><button class="btn2" onclick="dailyClose()">💰 قفل اليوم</button></div></header><div class="layout"><aside>${menu()}</aside><main>${content}</main></div>`}
function todayStr(){return new Date().toISOString().slice(0,10)}
function home(){let tod=patients.filter(p=>p.appts&&p.appts.some(a=>a.date==todayStr()));let totalInc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);return `<div class="card"><h2>أهلاً ${role=='doctor'?clinic.doctor:(clinic.secName||'سكرتيرة')}</h2><p>مرضى اليوم: ${tod.length} | الدخل: ${totalInc}</p><button class="btn" onclick="go('patients')">+ موعد جديد</button></div><div class="card"><h3>مرضى اليوم</h3>${tod.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${p.name}</b><button class="btn2" onclick="sel=${patients.indexOf(p)};page='patients';render()">فتح الملف</button></div>`).join('')||'<p>مفيش مرضى النهارده</p>'}</div><div class="card"><h3>الحضور</h3><button class="btn" onclick="checkIn()">تسجيل الحضور</button><button class="btn2" onclick="checkOut()" style="margin-top:6px;width:100%">تسجيل الانصراف</button></div>`}
function checkIn(){let d=todayStr();if(attendance.find(a=>a.date==d&&a.type=='in')){alert('سجلت قبل كده');return}attendance.push({date:d,type:'in',time:new Date().toLocaleTimeString()});save();alert('تم')}
function checkOut(){attendance.push({date:todayStr(),type:'out',time:new Date().toLocaleTimeString()});save();alert('تم')}
function patientsPage(){let q=document.getElementById('searchQ')?.value||'';let list=patients.filter(p=>p.name.includes(q)||p.phone.includes(q));return `<div class="card"><h3>تسجيل مريض</h3><input id="pName" placeholder="الاسم"><input id="pPhone" placeholder="الهاتف"><input id="pAge" placeholder="السن"><select id="pGender"><option>ذكر</option><option>أنثى</option></select><input id="pAddr" placeholder="العنوان"><input id="pNote" placeholder="ملاحظات"><button class="btn" onclick="addPatient()">حفظ</button><div id="dupMsg"></div></div><div class="card"><input id="searchQ" placeholder="ابحثي" value="${q}" oninput="render()"><div class="tableWrap"><table><tr><th>الاسم</th><th>الهاتف</th><th></th></tr>${list.map(p=>{let idx=patients.indexOf(p);return `<tr><td>${p.name}</td><td>${p.phone}</td><td><button class="btn2" onclick="sel=${idx};openPatient()">فتح الملف</button> <button class="btn2" onclick="deletePatient(${idx})">حذف</button></td></tr>`}).join('')}</table></div></div>${sel!=null&&patients[sel]?patientDetail():''}`}
function addPatient(){let n=document.getElementById('pName').value.trim(),ph=document.getElementById('pPhone').value.trim();if(!n){alert('اكتبي الاسم');return}let ex=patients.find(p=>p.phone==ph&&ph);if(ex){document.getElementById('dupMsg').innerHTML=`<p style="color:red">المريض موجود!</p><button class="btn" onclick="sel=${patients.indexOf(ex)};openPatient()">فتح ملفه</button>`;return}patients.push({id:Date.now(),name:n,phone:ph,age:document.getElementById('pAge').value,gender:document.getElementById('pGender').value,addr:document.getElementById('pAddr').value,note:document.getElementById('pNote').value,teeth:{},visits:[],appts:[],payments:[],plan:[],privateNote:'',rating:''});save();render()}
function editPatient(i){let p=patients[i];let n=prompt('الاسم الجديد',p.name);if(n!=null&&n.trim())p.name=n.trim();save();render()}
function deletePatient(i){if(confirm('متأكدة تحذفي '+patients[i].name+' ؟')){patients.splice(i,1);sel=null;save();render()}}
function openPatient(){page='patients';render()}
function patientDetail(){let p=patients[sel];if(!p)return '';let teethHtml='';for(let i=11;i<=18;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=21;i<=28;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=31;i<=38;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=41;i<=48;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;return `<div class="card" id="patientDetail"><button class="btn2" onclick="sel=null;render()">رجوع</button><h2>${p.name} - ${p.phone}</h2><p class="label">${p.age||''} | ${p.gender||''} | ${p.addr||''} | ${p.note||''}</p><div style="text-align:center;background:#F7FBFF;padding:12px;border-radius:10px">${teethHtml}</div><div class="grid2"><div><h3>سجل الزيارات</h3><textarea id="vText" placeholder="ما تم في الزيارة؟"></textarea><button class="btn" onclick="addVisit()">إضافة زيارة</button>${(p.visits||[]).map(v=>`<div>${v.date} - ${v.text}</div>`).join('')}</div><div><h3>خطة العلاج</h3><textarea id="planText"></textarea><button class="btn" onclick="addPlan()">حفظ</button>${(p.plan||[]).map((pl,pi)=>`<div>${pl.text} ${role=='doctor'?`<button class="btn2" onclick="approvePlan(${pi})">اعتماد</button>`:''}</div>`).join('')}</div></div><div class="grid2"><div><h3>الفواتير</h3><input id="payAmt" type="number" placeholder="المبلغ"><input id="payNote" placeholder="البيان"><button class="btnG" onclick="addPay()">تسجيل دفع</button>${(p.payments||[]).map(py=>`<div>${py.date} - ${py.amount} - ${py.note}</div>`).join('')}</div><div><h3>ملاحظات الدكتور</h3><textarea id="privNote">${p.privateNote||''}</textarea>${role=='doctor'?`<button class="btn" onclick="savePrivate()">حفظ</button>`:''}<h3>تقييم المريض</h3><select id="rateSel"><option value="">اختاري</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select><button class="btn2" onclick="saveRating()">حفظ</button><p>${p.rating||''}</p></div></div></div>`}
function toggleTooth(n){let p=patients[sel];let cur=p.teeth[n]||'';let next=cur==''?'filling':cur=='filling'?'extraction':cur=='extraction'?'treatment':'';p.teeth[n]=next;save();render()}
function addVisit(){let p=patients[sel],tx=document.getElementById('vText').value;if(!tx)return;p.visits.push({date:todayStr(),text:tx});save();render()}
function addPlan(){let p=patients[sel],tx=document.getElementById('planText').value;if(!tx)return;p.plan.push({text:tx,approved:false});save();render()}
function approvePlan(i){patients[sel].plan[i].approved=true;save();render()}
function addPay(){let p=patients[sel],a=document.getElementById('payAmt').value;if(!a)return;p.payments.push({date:todayStr(),amount:a,note:document.getElementById('payNote').value});save();render()}
function savePrivate(){patients[sel].privateNote=document.getElementById('privNote').value;save();alert('اتحفظت')}
function saveRating(){patients[sel].rating=document.getElementById('rateSel').value;save();render()}
  </script>
  <script>
function appointPage(){let all=[];patients.forEach((p,pi)=>{(p.appts||[]).forEach(a=>all.push({date:a.date,time:a.time,note:a.note,pi:pi,name:p.name}))});all.sort((a,b)=>a.date.localeCompare(b.date));let opts=patients.map((p,k)=>`<option value="${k}">${p.name} - ${p.phone}</option>`).join('');let rows=all.map(a=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${a.date} ${a.time||''} - ${a.name}</b><span>${a.note||''} <button class="btn2" onclick="delAppt(${a.pi},'${a.date}','${a.time||''}')">❌</button></span></div>`).join('')||'مفيش مواعيد';return `<div class="card"><h3>+ موعد جديد</h3><select id="aPat">${opts}</select><input id="aDate" type="date" value="${todayStr()}"><input id="aTime" type="time"><input id="aNote" placeholder="ملاحظة"><button class="btn" onclick="addAppt()">حفظ</button></div><div class="card"><h3>المواعيد</h3>${rows}</div>`}
function addAppt(){let pi=document.getElementById('aPat').value;if(pi==''||!patients[pi])return;patients[pi].appts.push({date:document.getElementById('aDate').value,time:document.getElementById('aTime').value,note:document.getElementById('aNote').value});save();render()}
function delAppt(pi,d,ti){patients[pi].appts=patients[pi].appts.filter(a=>!(a.date==d&&a.time==ti));save();render()}
function stockPage(){let today=new Date();let rows=stock.map((s,i)=>{let isExp=s.exp&&new Date(s.exp)<today;let isLow=s.qty<=s.alert;return `<tr><td>${s.name}</td><td>${s.qty}</td><td>${s.exp||''} ${isExp?`<span class="exp">منتهي</span>`:''}</td><td>${isLow?`<span class="low">قرب يخلص</span>`:'متوفر'}</td><td><button class="btn2" onclick="useStock(${i})">-1 استخدمت</button></td><td><button class="btn2" onclick="delStock(${i})">❌</button></td></tr>`}).join('');return `<div class="card"><h3>إضافة صنف جديد</h3><input id="sName" placeholder="اسم الصنف - مثال: بنج"><input id="sQty" type="number" placeholder="الكمية"><input id="sPrice" type="number" placeholder="سعر الشراء الكلي"><input id="sExp" type="date"><input id="sAlert" type="number" placeholder="تنبيه لما يقل عن"><button class="btn" onclick="addStock()">إضافة صنف</button></div><div class="card"><h3>المخزون الحالي</h3><div class="tableWrap"><table><tr><th>الصنف</th><th>الكمية</th><th>تاريخ الانتهاء</th><th>الحالة</th><th></th><th></th></tr>${rows}</table></div></div>`}
function addStock(){let n=document.getElementById('sName').value;if(!n)return;stock.push({name:n,qty:+document.getElementById('sQty').value||0,price:+document.getElementById('sPrice').value||0,exp:document.getElementById('sExp').value,alert:+document.getElementById('sAlert').value||5});save();render()}
function useStock(i){if(stock[i].qty>0)stock[i].qty--;save();render()}
function delStock(i){stock.splice(i,1);save();render()}
function reportsPage(){if(role!='doctor'){alert('التقارير للدكتور بس');page='home';render();return ''}let inc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);let ex=manualExps.reduce((s,e)=>s+(+e.amount||0),0)+stock.reduce((s,x)=>s+(+x.price||0),0);let pres=attendance.filter(a=>a.type=='in').length;let exHtml=manualExps.map(m=>`<div>${m.date} - ${m.amount} - ${m.note}</div>`).join('');return `<div class="card"><h3>التقارير</h3><div class="grid3"><div class="card"><b>الدخل</b><h2>${inc}</h2></div><div class="card"><b>المصاريف</b><h2>${ex}</h2></div><div class="card"><b>الصافي</b><h2>${inc-ex}</h2></div></div><p>عدد المرضى: ${patients.length}</p></div><div class="card"><h3>حضور السكرتيرة</h3><p>يوم حضور: ${pres}</p></div><div class="card"><h3>مصروف يدوي</h3><input id="eAmt" type="number" placeholder="المبلغ"><input id="eNote" placeholder="البيان - إيجار / كهربا"><button class="btn" onclick="addExp()">حفظ</button>${exHtml}</div><div class="card"><h3>نسخة احتياطية</h3><button class="btn" onclick="backup()">تحميل نسخة احتياطية</button><input type="file" id="restoreFile" onchange="restore(event)"></div>`}
function addExp(){let a=document.getElementById('eAmt').value;if(!a)return;manualExps.push({date:todayStr(),amount:a,note:document.getElementById('eNote').value});save();render()}
function backup(){let data={clinic:clinic,patients:patients,stock:stock,manualExps:manualExps,attendance:attendance,waitList:waitList,doctorId:DOCTOR_ID};let b=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+DOCTOR_ID+'-'+todayStr()+'.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){try{let d=JSON.parse(r.result);if(d.patients)patients=d.patients;if(d.stock)stock=d.stock;if(d.manualExps)manualExps=d.manualExps;if(d.attendance)attendance=d.attendance;if(d.waitList)waitList=d.waitList;if(d.clinic)clinic=d.clinic;save();alert('تم استرجاع النسخة');render()}catch(err){alert('ملف غلط')}};r.readAsText(f)}
function settingsPage(){return `<div class="card"><h3>الإعدادات</h3><label class="label">اسم العيادة</label><input id="setName" value="${clinic.name}"><label class="label">اسم الدكتور</label><input id="setDoctor" value="${clinic.doctor}"><label class="label">التخصص</label><input id="setTitle" value="${clinic.doctorTitle}"><label class="label">اسم السكرتيرة</label><input id="setSec" value="${clinic.secName||''}"><label class="label">رقم سري الدكتور</label><input id="setPassDoc" value="${clinic.passDoc}"><label class="label">رقم سري السكرتيرة</label><input id="setPassSec" value="${clinic.passSec}"><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div><div class="card"><h3>لينك عيادتك</h3><input readonly value="${doctorLink(DOCTOR_ID)}" onclick="this.select()"></div>`}
function saveSettings(){clinic.name=document.getElementById('setName').value;clinic.doctor=document.getElementById('setDoctor').value;clinic.doctorTitle=document.getElementById('setTitle').value;clinic.secName=document.getElementById('setSec').value;clinic.passDoc=document.getElementById('setPassDoc').value;clinic.passSec=document.getElementById('setPassSec').value;myDoctor.passDoc=clinic.passDoc;myDoctor.passSec=clinic.passSec;save();alert('اتحفظت');render();}
function waitingPage(){let rows=waitList.map((w,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${w.name} - ${w.phone}</b><button class="btn2" onclick="delWait(${i})">❌</button></div>`).join('');return `<div class="card"><h3>قائمة الانتظار</h3><input id="wName" placeholder="اسم المريض"><input id="wPhone" placeholder="الهاتف"><button class="btn" onclick="addWait()">حفظ</button>${rows}</div>`}
function addWait(){let n=document.getElementById('wName').value;if(!n)return;waitList.push({name:n,phone:document.getElementById('wPhone').value});save();render();}
function delWait(i){waitList.splice(i,1);save();render();}
function dailyClose(){let inc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);alert('قفل اليوم الدخل: '+inc+' عدد المرضى: '+patients.length);}
</script>

<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
<script>
try{
var firebaseConfig={apiKey:"AIzaSyC_P2FTHIRdiK_F1z1Y7Qerlp14yqniFa4",authDomain:"buba-clinic-app.firebaseapp.com",projectId:"buba-clinic-app",storageBucket:"buba-clinic-app.firebasestorage.app",messagingSenderId:"403832309031",appId:"1:403832309031:web:907f24b74083224106e6"};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var oldSave=save;
var isLoadingFromCloud=false;
save=function(){oldSave();if(isLoadingFromCloud)return;try{db.collection("clinic_data").doc(DOCTOR_ID).set({clinic:clinic,patients:patients,stock:stock,manualExps:manualExps,attendance:attendance,waitList:waitList,doctorId:DOCTOR_ID,updatedAt:new Date().toISOString()}).catch(function(e){console.log(e)})}catch(e){console.log(e)}};
try{db.collection("doctors").doc(DOCTOR_ID).set({id:DOCTOR_ID,name:myDoctor.name,expiresAt:myDoctor.expiresAt,active:myDoctor.active,passDoc:myDoctor.passDoc,passSec:myDoctor.passSec,updatedAt:new Date().toISOString()},{merge:true}).catch(function(){})}catch(e){}
db.collection("clinic_data").doc(DOCTOR_ID).get().then(function(doc){if(doc.exists){var d=doc.data();if(d){isLoadingFromCloud=true;if(d.patients&&d.patients.length>0)patients=d.patients;if(d.stock)stock=d.stock;if(d.manualExps)manualExps=d.manualExps;if(d.attendance)attendance=d.attendance;if(d.waitList)waitList=d.waitList;if(d.clinic){clinic=d.clinic;if(myDoctor.passDoc)clinic.passDoc=myDoctor.passDoc;if(myDoctor.passSec)clinic.passSec=myDoctor.passSec;}localStorage.setItem(_docKey('patients'),JSON.stringify(patients));localStorage.setItem(_docKey('stock'),JSON.stringify(stock));localStorage.setItem(_docKey('exps'),JSON.stringify(manualExps));localStorage.setItem(_docKey('att'),JSON.stringify(attendance));localStorage.setItem(_docKey('wait'),JSON.stringify(waitList));localStorage.setItem(_docKey('clinic'),JSON.stringify(clinic));isLoadingFromCloud=false;render()}}}).catch(function(e){console.log(e)});
db.collection("clinic_data").doc(DOCTOR_ID).onSnapshot(function(doc){if(!doc.exists)return;var d=doc.data();if(!d||isLoadingFromCloud)return;if(d.updatedAt&&d.patients){patients=d.patients;stock=d.stock||stock;manualExps=d.manualExps||manualExps;attendance=d.attendance||attendance;waitList=d.waitList||waitList;if(d.clinic){clinic=d.clinic;if(myDoctor.passDoc)clinic.passDoc=myDoctor.passDoc;if(myDoctor.passSec)clinic.passSec=myDoctor.passSec;}oldSave();render()}});
}catch(e){console.log(e)}
login();
// إصلاح أزرار الإدارة
function editDoctor(id){
  var n = prompt('الاسم الجديد للدكتور:', doctorsRegistry[id].name);
  if(n){ doctorsRegistry[id].name = n; saveRegistry(); renderAdmin(); alert('تم تغيير الاسم'); }
}
function editPassword(id){
  var p = prompt('الرمز الجديد للدكتور:', doctorsRegistry[id].password);
  if(p){ doctorsRegistry[id].password = p; saveRegistry(); renderAdmin(); alert('تم تغيير الرمز'); }
}
function toggleDoctor(id){
  doctorsRegistry[id].active = !doctorsRegistry[id].active;
  saveRegistry();
  try{ if(typeof db!=='undefined' && db){ db.collection("doctors").doc(id).set({active:doctorsRegistry[id].active}, {merge:true}); } }catch(e){}
  renderAdmin();
  alert(doctorsRegistry[id].active ? 'تم فتح العيادة - شغال' : 'تم قفل العيادة');
}
function deleteDoctor(id){
  if(confirm('متأكدة تحذفي '+doctorsRegistry[id].name+' ؟')){ delete doctorsRegistry[id]; saveRegistry(); renderAdmin(); }
}
function extendDoctor(id){
  var d = prompt('كام يوم عايزة تمدي؟', '30');
  if(d){ var exp = new Date(); exp.setDate(exp.getDate()+parseInt(d)); doctorsRegistry[id].expiresAt = exp.toISOString(); saveRegistry(); renderAdmin(); alert('تم التمديد'); }
}
  // مزامنة كاملة: الإدارة -> موبايل الدكتور
(function(){
  try{
    if(typeof db==='undefined' || !db) return;

    // 1- أي تعديل من الإدارة يتبعت للنت كله
    var oldSave = window.saveRegistry;
    window.saveRegistry = function(){
      if(oldSave) oldSave();
      try{
        if(window.doctorsRegistry){
          Object.keys(window.doctorsRegistry).forEach(function(id){
            if(id==='barakat') return;
            var d = window.doctorsRegistry[id];
            db.collection("doctors").doc(id).set({
              name: d.name,
              password: d.password,
              active: d.active,
              expiresAt: d.expiresAt,
              createdAt: d.createdAt || '',
              updatedAt: new Date().toISOString()
            }, {merge:true});
          });
        }
      }catch(e){}
    };

    // 2- موبايل الدكتور يسمع كل التعديلات
    if(window.DOCTOR_ID && window.DOCTOR_ID!=='barakat'){
      db.collection("doctors").doc(window.DOCTOR_ID).onSnapshot(function(doc){
        if(!doc.exists) return;
        var cloud = doc.data();
        try{
          var local = JSON.parse(localStorage.getItem('barakat_doctor_'+window.DOCTOR_ID) || '{}');
          var changed = false;
          if(cloud.name && cloud.name!==local.name){ local.name=changed=true; }
          if(cloud.password && cloud.password!==local.password){ local.password=changed=true; }
          if(typeof cloud.active!=='undefined' && cloud.active!==local.active){ local.active=cloud.active; changed=true; }
          if(cloud.expiresAt && cloud.expiresAt!==local.expiresAt){ local.expiresAt=cloud.expiresAt; changed=true; }
          if(changed){
            localStorage.setItem('barakat_doctor_'+window.DOCTOR_ID, JSON.stringify(local));
            // لو الاسم اتغير حدثه في الشاشة
            var nameEl = document.querySelector('.clinic-name, #clinicName, h1');
            if(nameEl && cloud.name) nameEl.textContent = cloud.name;
          }
        }catch(e){}
        // القفل والفتح
        if(cloud.active === false){
          if(document.body.innerHTML.indexOf('العيادة مقفولة')===-1){
            document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:Arial;padding:20px;background:#fff"><div style="font-size:70px">🔒</div><h1 style="color:#c00">العيادة مقفولة</h1><p style="font-size:18px">تم قفل العيادة من الإدارة</p></div>';
          }
        }
        if(cloud.active === true && document.body.innerHTML.indexOf('العيادة مقفولة')>-1){ location.reload(); }
      });
    }
  }catch(e){}
})();
</script>

<meta name="theme-color" content="#0A2540"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="data:image/svg+xml,[STRIPPED]">
<title>عيادة لطب الأسنان</title><style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#EAF6FF;color:#0A2540}
header{background:#0A2540;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;gap:8px}

.label{font-size:13px;color:#64748b}.tag{padding:4px 8px;border-radius:20px;font-size:12px;background:#dcfce7}.low{color:#dc2626;font-weight:700}.exp{color:#dc2626;font-weight:700;background:#fee2e2;padding:4px 8px;border-radius:20px;font-size:12px}

@media(max-width:900px){.layout{flex-direction:column}.menuBtn{display:block}aside{width:100%;display:none;padding:12px}aside.show{display:block}main{padding:12px}.grid3,.grid2{grid-template-columns:1fr}.tooth{width:36px;height:36px}}
</style></head><body><div id="app"></div>
<script>
const _params=new URLSearchParams(location.search);
const IS_ADMIN=_params.get('admin')=='1';
const ADMIN_PASS='1111';
let DOCTOR_ID=(_params.get('d')||localStorage.getItem('lastDoctor')||'barakat').toString().toLowerCase().trim().replace(/\s+/g,'-').replace(/[^a-z0-9\u0600-\u06FF\-_]/gi,'')||'barakat';
if(!IS_ADMIN) localStorage.setItem('lastDoctor',DOCTOR_ID);
function _docKey(k){return 'barakat_'+DOCTOR_ID+'_'+k}
function _getDoc(k,fallback){let v=localStorage.getItem(_docKey(k)); if(v) return JSON.parse(v); if(DOCTOR_ID==='barakat'){let old=localStorage.getItem('barakat_'+k); if(old) return JSON.parse(old);} return JSON.parse(fallback)}
let doctorsRegistry=JSON.parse(localStorage.getItem('barakat_all_doctors')||'{}');
function saveRegistry(){localStorage.setItem('barakat_all_doctors',JSON.stringify(doctorsRegistry))}
function getDoctorInfo(id){
  if(!doctorsRegistry[id]){
    let now=Date.now();
    let exp = now+30*24*60*60*1000;
    doctorsRegistry[id]={id:id,name:id,createdAt:now,expiresAt:exp,active:true,passDoc:'12321',passSec:'2222'};
    saveRegistry();
  }
  if(!doctorsRegistry[id].passDoc) doctorsRegistry[id].passDoc='12321';
  if(!doctorsRegistry[id].passSec) doctorsRegistry[id].passSec='2222';
  return doctorsRegistry[id];
}
let myDoctor=getDoctorInfo(DOCTOR_ID);
function isExpired(){ if(!myDoctor.active) return true; return Date.now()>myDoctor.expiresAt; }
function daysLeft(){ return Math.max(0,Math.ceil((myDoctor.expiresAt-Date.now())/86400000)); }
function doctorLink(id){return location.origin+location.pathname+'?d='+encodeURIComponent(id)}
try{
  let manifest={name:'عيادة بركات',short_name:'العيادة',start_url:location.pathname,display:'standalone',background_color:'#EAF6FF',theme_color:'#0A2540',icons:[{src:"data:image/svg+xml,[STRIPPED]",sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  let mb=new Blob([JSON.stringify(manifest)],{type:'application/json'});let mu=URL.createObjectURL(mb);let lm=document.createElement('link');lm.rel='manifest';lm.href=mu;document.head.appendChild(lm);
  if('serviceWorker' in navigator){
    let swCode=`self.addEventListener('install',e=>{e.waitUntil(caches.open('clinic-v3').then(c=>c.addAll([location.pathname||'/']).catch(()=>{}))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(location.pathname))))});`;
    let swBlob=new Blob([swCode],{type:'text/javascript'});let swUrl=URL.createObjectURL(swBlob);navigator.serviceWorker.register(swUrl).catch(()=>{});
  }
}catch(e){}
</script>
<script>
let lang='ar',role=null,page='home',sel=0;
// إصلاح مهم: الدكتور الجديد مياخدش بيانات بركات أبدا
let _clinicRaw = localStorage.getItem(_docKey('clinic'));
let clinic;
if(_clinicRaw){ clinic = JSON.parse(_clinicRaw); }
else if(DOCTOR_ID==='barakat'){
  clinic = JSON.parse(localStorage.getItem('barakat_clinic')||'{"name":"عيادة بركات لطب الأسنان","doctor":"د. كريم بركات","doctorTitle":"أخصائي طب وجراحة الفم والأسنان","secName":"","passDoc":"12321","passSec":"2222"}');
} else {
  clinic = {name: myDoctor.name || DOCTOR_ID, doctor: myDoctor.name || DOCTOR_ID, doctorTitle:'أخصائي طب وجراحة الفم والأسنان', secName:'', passDoc: myDoctor.passDoc||'12321', passSec: myDoctor.passSec||'2222'};
  localStorage.setItem(_docKey('clinic'), JSON.stringify(clinic));
}
// لو الرقم السري في الريجستري مختلف عن العيادة، الريجستري هو الصح
if(myDoctor.passDoc) clinic.passDoc = myDoctor.passDoc;
if(myDoctor.passSec) clinic.passSec = myDoctor.passSec;
let T={en:{dash:'Dashboard',patients:'Patients',appoint:'Appointments',stock:'Inventory',reports:'Reports',settings:'Settings',waiting:'Waiting List',logout:'Logout',today:'Today Patients',newAppt:'+ New Appointment',open:'Open File',checkIn:'Check In',checkOut:'Check Out',attTitle:'Attendance',addItem:'Add New Item',itemName:'Item name',qty:'Quantity',price:'Total Purchase Price',expDate:'Expiry Date',alertQty:'Alert when less than',add:'Add Item',current:'Current Stock',used:'Used',avail:'Available',low:'Almost Finished',back:'Back',visitHist:'Visit History',addVisit:'Add Visit',whatDone:'What was done?',plan:'Treatment Plan',approve:'Approve Plan',invoices:'Invoices',recordPay:'Record Payment',register:'Register Patient',name:'Name',phone:'Phone',save:'Save',searchOld:'Patient already exists!',openOld:'Open Old File',newPat:'New patient',reportsTitle:'Reports',secAtt:'Secretary Attendance',present:'Days Present',absent:'Days Absent',rate:'Attendance Rate',vacation:'Request Vacation',backup:'Backup',dailyClose:'Daily Closing',manualExp:'Manual Expense',whatsapp:'WhatsApp',privateNote:'Doctor Private Note',rating:'Patient Rating'},
ar:{dash:'لوحة التحكم',patients:'المرضى',appoint:'المواعيد',stock:'المخزون',reports:'التقارير',settings:'الإعدادات',waiting:'قائمة الانتظار',logout:'تسجيل الخروج',today:'مرضى اليوم',newAppt:'+ موعد جديد',open:'فتح الملف',checkIn:'✅ تسجيل الحضور',checkOut:'تسجيل الانصراف',attTitle:'الحضور والانصراف',addItem:'إضافة صنف جديد',itemName:'اسم الصنف - مثال: بنج',qty:'الكمية',price:'سعر الشراء الكلي',expDate:'تاريخ الانتهاء',alertQty:'تنبيه لما يقل عن',add:'إضافة صنف',current:'المخزون الحالي',used:'استخدمت',avail:'✅ متوفر',low:'⚠️ قرب يخلص',back:'رجوع',visitHist:'سجل الزيارات',addVisit:'إضافة زيارة',whatDone:'ما تم في الزيارة دي؟',plan:'خطة العلاج',approve:'اعتماد خطة العلاج',invoices:'الفواتير',recordPay:'تسجيل دفع',register:'تسجيل مريض',name:'الاسم',phone:'الهاتف',save:'حفظ',searchOld:'المريض موجود بالفعل!',openOld:'فتح ملفه القديم',newPat:'✅ مريض جديد',reportsTitle:'التقارير',secAtt:'حضور السكرتيرة',present:'يوم حضور',absent:'يوم غياب',rate:'نسبة الحضور',vacation:'طلب إجازة',backup:'نسخة احتياطية',dailyClose:'قفل اليوم',manualExp:'مصروف يدوي - إيجار / كهربا',whatsapp:'💬 واتساب',privateNote:'ملاحظات الدكتور الخاصة - الدكتور بس',rating:'تقييم المريض'}};
function t(k){return T[lang][k]||k}function L(a,e){return lang=='ar'?a:e}
</script>
<script>
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';render()}
let patients=_getDoc('patients','[]');
let stock=_getDoc('stock','[]');
let manualExps=_getDoc('exps','[]');
let attendance=_getDoc('att','[]');
let waitList=_getDoc('wait','[]');
function save(){localStorage.setItem(_docKey('patients'),JSON.stringify(patients));localStorage.setItem(_docKey('stock'),JSON.stringify(stock));localStorage.setItem(_docKey('exps'),JSON.stringify(manualExps));localStorage.setItem(_docKey('wait'),JSON.stringify(waitList));localStorage.setItem(_docKey('att'),JSON.stringify(attendance));localStorage.setItem(_docKey('clinic'),JSON.stringify(clinic));saveRegistry();}
function showLocked(){
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:460px;margin:50px auto;text-align:center"><div style="font-size:60px">🔒</div><h2>اشتراكك خلص</h2><p>الشهر المجاني بتاع الدكتور <b>${DOCTOR_ID}</b> خلص.<br>كلم الإدارة عشان تجدد الاشتراك ويتفتح السيستم تاني.</p><p class="label">فاضل: 0 يوم | انتهى يوم ${new Date(myDoctor.expiresAt).toLocaleDateString('ar-EG')}</p><a href="https://wa.me/201159534097?text=${encodeURIComponent('عايز اجدد اشتراك عيادتي '+DOCTOR_ID)}" target="_blank"><button class="btnG">💬 كلم الإدارة واتساب</button></a><br><br><button class="btn2" onclick="location.href=location.pathname+'?admin=1'">دخول الإدارة</button></div>`;
}
  <script>
let adminLogged=false;
function renderAdmin(){
  if(!adminLogged){
    document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:50px auto;text-align:center"><div style="font-size:48px">👑</div><h2>لوحة تحكم الإدارة</h2><p class="label">انتي بس اللي تدخلي هنا</p><input id="adminPw" type="password" placeholder="كلمة سر الإدارة"><button class="btn" onclick="checkAdmin()">دخول</button><p class="label">كلمة السر الافتراضية: 1111</p></div>`;
    return;
  }
  let list=Object.values(doctorsRegistry);
  document.getElementById('app').innerHTML=`<header><div><b>👑 إدارة السيستم</b><br><small>بيع لكل الدكاترة من هنا</small></div><button class="btn2" onclick="location.href=location.pathname">رجوع لعيادتي</button></header><main>
  <div class="card"><h3>➕ إضافة دكتور جديد</h3><input id="newDocId" placeholder="اسم الدكتور في اللينك - مثال: dr-ahmed"><input id="newDocName" placeholder="اسم العيادة - مثال: عيادة د. أحمد"><input id="newPassDoc" placeholder="رقم سري الدكتور - مثال: 5555"><input id="newPassSec" placeholder="رقم سري السكرتيرة - مثال: 6666"><button class="btn" onclick="addDoctor()">إنشاء لينك + شهر مجاني</button><p class="label">لو سيبتي الرقم السري فاضي هيبقى الدكتور 12321 والسكرتيرة 2222</p></div>
  <div class="card"><h3>الدكاترة (${list.length})</h3>${list.map(d=>{
    let left=Math.max(0,Math.ceil((d.expiresAt-Date.now())/86400000))+' يوم فاضل';
    let expired=Date.now()>d.expiresAt;
    return `<div style="border:1px solid #EAF6FF;border-radius:12px;padding:12px;margin-bottom:10px"><b>${d.name||d.id}</b> <span style="font-size:12px">(${d.id})</span><br><span class="label">${left} | الحالة: ${d.active&&!expired?'✅ شغال':'🔒 مقفول'} | ينتهي: ${new Date(d.expiresAt).toLocaleDateString('ar-EG')}</span><br><span style="font-size:13px">🔑 دكتور: <b>${d.passDoc||'12321'}</b> | سكرتيرة: <b>${d.passSec||'2222'}</b></span><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn2" onclick="renewDoctor('${d.id}')">🔄 تجديد شهر</button><button class="btn2" onclick="toggleDoctor('${d.id}')">${d.active?'🔒 قفل':'🔓 فتح'}</button><button class="btn2" onclick="copyLink('${d.id}')">📋 نسخ اللينك</button><button class="btn2" onclick="fixDoctorClinic('${d.id}')">✨ إصلاح الاسم</button><button class="btn2" onclick="editDoctorPass('${d.id}')">🔑 تغيير الرقم السري</button><button class="btn2" onclick="deleteDoctor('${d.id}')" style="color:#dc2626">🗑️ حذف</button></div><input readonly value="${doctorLink(d.id)}" onclick="this.select()" style="font-size:12px"></div>`
  }).join('')||'<p>لسه مفيش دكاترة</p>'}</div></main>`;
}
function checkAdmin(){ if(document.getElementById('adminPw').value==ADMIN_PASS){adminLogged=true;renderAdmin()}else alert('كلمة سر الإدارة غلط') }
function addDoctor(){ let id=document.getElementById('newDocId').value.trim().toLowerCase().replace(/\s+/g,'-'); let nm=document.getElementById('newDocName').value.trim()||id; let pd=document.getElementById('newPassDoc').value.trim()||'12321'; let ps=document.getElementById('newPassSec').value.trim()||'2222'; if(!id){alert('اكتبي اسم الدكتور في اللينك');return} if(doctorsRegistry[id]){alert('الدكتور ده موجود بالفعل');return} doctorsRegistry[id]={id:id,name:nm,createdAt:Date.now(),expiresAt:Date.now()+30*86400000,active:true,passDoc:pd,passSec:ps}; saveRegistry(); let newClinic={name:nm,doctor:nm,doctorTitle:'أخصائي طب وجراحة الفم والأسنان',secName:'',passDoc:pd,passSec:ps}; localStorage.setItem('barakat_'+id+'_clinic',JSON.stringify(newClinic)); renderAdmin(); alert('اتعمل! \nاللينك: '+doctorLink(id)+'\nرقم الدكتور: '+pd+'\nرقم السكرتيرة: '+ps); }
function fixDoctorClinic(id){ let d=doctorsRegistry[id]; if(!d) return; let fixed={name:d.name,doctor:d.name,doctorTitle:'أخصائي طب وجراحة الفم والأسنان',secName:'',passDoc:d.passDoc||'12321',passSec:d.passSec||'2222'}; localStorage.setItem('barakat_'+id+'_clinic',JSON.stringify(fixed)); if(id===DOCTOR_ID){clinic=fixed;} alert('اتصلح ✅\nالاسم بقى: '+d.name+'\nرقم الدكتور: '+fixed.passDoc); renderAdmin(); }
function editDoctorPass(id){ let d=doctorsRegistry[id]; let nd=prompt('رقم سري الدكتور الجديد لـ '+d.name, d.passDoc||'12321'); if(nd==null) return; let ns=prompt('رقم سري السكرتيرة الجديد', d.passSec||'2222'); if(ns==null) return; d.passDoc=nd.trim()||'12321'; d.passSec=ns.trim()||'2222'; saveRegistry(); let cur=JSON.parse(localStorage.getItem('barakat_'+id+'_clinic')||'{}'); cur.passDoc=d.passDoc; cur.passSec=d.passSec; localStorage.setItem('barakat_'+id+'_clinic',JSON.stringify(cur)); alert('اتغير ✅'); renderAdmin(); }
function renewDoctor(id){ doctorsRegistry[id].expiresAt=Math.max(Date.now(),doctorsRegistry[id].expiresAt)+30*86400000; doctorsRegistry[id].active=true; saveRegistry(); renderAdmin(); alert('اتجدد شهر ✅'); }
function toggleDoctor(id){ doctorsRegistry[id].active=!doctorsRegistry[id].active; saveRegistry(); renderAdmin(); }
function deleteDoctor(id){ if(confirm('متأكدة تحذفي '+id+' ؟')){delete doctorsRegistry[id]; localStorage.removeItem('barakat_'+id+'_clinic'); saveRegistry(); renderAdmin();} }
function copyLink(id){ let link=doctorLink(id); if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>alert('اتنسخ ✅\n'+link)); else {prompt('انسخي اللينك:',link)} }
function login(){
  if(IS_ADMIN){renderAdmin();return}
  if(isExpired()){showLocked();return}
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><div style="font-size:48px">🦷</div><h2>${clinic.name}</h2><h3 style="margin:0;color:#0A2540">${clinic.doctor}</h3><p class="label">${clinic.doctorTitle}</p><p class="label">الدكتور: ${DOCTOR_ID} | ${'فاضل '+daysLeft()+' يوم'}</p><input id="pw" type="password" placeholder="${L('كلمة السر','Password')}"><button class="btn" onclick="check()">${L('دخول','Login')}</button><div style="display:flex;gap:6px;justify-content:center;margin-top:10px"><button class="btn2" onclick="lang='ar';login()">العربية</button><button class="btn2" onclick="lang='en';login()">English</button></div></div>`
}
function check(){let v=document.getElementById('pw').value;if(v==clinic.passDoc){role='doctor';page='home';render()}else if(v==clinic.passSec){role='sec';page='home';render()}else alert(L('كلمة سر غلط','Wrong password'))}
function go(p){if(p=='settings'&&role!='doctor'){alert(L('الإعدادات للدكتور بس','Settings for Doctor only'));return}page=p;render()}
function menu(){let m=[['home',lang=='ar'?'🏠 الرئيسية':'🏠 Home'],['patients','👥 '+t('patients')],['appoint','📅 '+t('appoint')],['stock','📦 '+t('stock')]];if(role=='doctor')m.push(['reports','📊 '+t('reports')],['settings','⚙️ '+t('settings')]);m.push(['waiting','⏳ '+t('waiting')]);return m.map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+`<button onclick="role=null;login()">🚪 ${t('logout')}</button><div style="margin-top:10px;display:flex;gap:6px"><button class="btn2" onclick="setLang('ar')">عربي</button><button class="btn2" onclick="setLang('en')">EN</button></div>`}
function render(){if(IS_ADMIN){renderAdmin();return}if(isExpired()){showLocked();return}if(!role){login();return}document.getElementById('app').innerHTML=`<header><button class="menuBtn" onclick="document.querySelector('aside').classList.toggle('show')">☰</button><div><b>🦷 ${clinic.name}</b><br><small>${clinic.doctor} | ${role=='doctor'?L('دكتور','Doctor'):L('سكرتيرة','Secretary')} | ${'فاضل '+daysLeft()+' يوم'}</small></div><div><button class="btn2" onclick="dailyClose()">💰 ${t('dailyClose')}</button></div></header><div class="layout"><aside>${menu()}</aside><main>${page=='home'?home():page=='patients'?patientsPage():page=='appoint'?appointPage():page=='stock'?stockPage():page=='reports'?reportsPage():page=='settings'?settingsPage():page=='waiting'?waitingPage():home()}</main></div>`}
function todayStr(){return new Date().toISOString().slice(0,10)}
function home(){let tod=patients.filter(p=>p.appts&&p.appts.some(a=>a.date==todayStr()));let totalInc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);let totalEx=manualExps.reduce((s,e)=>s+(+e.amount||0),0)+stock.reduce((s,i)=>s+(+i.price||0),0);return `<div class="card"><h2>${L('أهلاً','Welcome')} ${role=='doctor'?clinic.doctor:clinic.secName||L('سكرتيرة','Secretary')}</h2><p>${L('مرضى اليوم:','Today:')} ${tod.length} | ${L('إجمالي الدخل:','Total Income:')} ${totalInc} | ${L('إجمالي المصاريف:','Expenses:')} ${totalEx}</p><button class="btn" onclick="go('patients')">${t('newAppt')}</button></div><div class="card"><h3>${t('today')}</h3>${tod.length?tod.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${p.name}</b><button class="btn2" onclick="sel=patients.indexOf(patients.find(x=>x.id==${p.id}));page='patients';render()">${t('open')}</button></div>`).join(''):`<p class="label">${L('مفيش مرضى النهارده','No patients today')}</p>`}</div><div class="card"><h3>${t('attTitle')}</h3><button class="btn" onclick="checkIn()">${t('checkIn')}</button><button class="btn2" onclick="checkOut()" style="margin-top:6px;width:100%">${t('checkOut')}</button><div id="attMsg" style="margin-top:8px"></div></div>`}
function checkIn(){let d=todayStr();if(attendance.find(a=>a.date==d&&a.type=='in')){alert(L('سجلت حضور قبل كده','Already checked in'));return}attendance.push({date:d,type:'in',time:new Date().toLocaleTimeString()});save();alert(L('تم تسجيل الحضور ✅','Checked in'))}
function checkOut(){let d=todayStr();attendance.push({date:d,type:'out',time:new Date().toLocaleTimeString()});save();alert(L('تم تسجيل الانصراف','Checked out'))}
function patientsPage(){let q=document.getElementById('searchQ')?.value||'';let list=patients.filter(p=>p.name.includes(q)||p.phone.includes(q));return `<div class="card"><h3>${t('register')}</h3><input id="pName" placeholder="${t('name')}"><input id="pPhone" placeholder="${t('phone')}"><input id="pAge" placeholder="${L('السن','Age')}"><select id="pGender"><option>${L('ذكر','Male')}</option><option>${L('أنثى','Female')}</option></select><input id="pAddr" placeholder="${L('العنوان','Address')}"><input id="pNote" placeholder="${L('ملاحظات','Notes')}"><button class="btn" onclick="addPatient()">${t('save')}</button><div id="dupMsg"></div></div><div class="card"><input id="searchQ" placeholder="${L('ابحثي بالاسم أو الهاتف','Search')}" value="${q}" oninput="render()"><div class="tableWrap"><table><tr><th>${t('name')}</th><th>${t('phone')}</th><th></th><th></th></tr>${list.map((p,i)=>`<tr><td>${p.name}</td><td>${p.phone}</td><td><a href="https://wa.me/${p.phone.replace(/[^0-9]/g,'')}" target="_blank"><button class="btn2">${t('whatsapp')}</button></a></td><td><div class="patientMenu"><button class="btn2" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">⋮</button><div class="patientDrop"><button onclick="sel=${patients.indexOf(p)};openPatient()">📂 ${t('open')}</button><button onclick="editPatient(${patients.indexOf(p)})">✏️ ${L('تعديل','Edit')}</button><button onclick="deletePatient(${patients.indexOf(p)})" style="color:#dc2626">🗑️ ${L('حذف','Delete')}</button></div></div></td></tr>`).join('')}</table></div></div>${sel!=null&&patients[sel]?patientDetail():' '}`}
function addPatient(){let n=document.getElementById('pName').value.trim(),ph=document.getElementById('pPhone').value.trim();if(!n){alert(L('اكتبي الاسم','Enter name'));return}let ex=patients.find(p=>p.phone==ph&&ph);if(ex){document.getElementById('dupMsg').innerHTML=`<p style="color:red">${t('searchOld')}</p><button class="btn" onclick="sel=${patients.indexOf(ex)};openPatient()">${t('openOld')}</button>`;return}let id=Date.now();patients.push({id:id,name:n,phone:ph,age:document.getElementById('pAge').value,gender:document.getElementById('pGender').value,addr:document.getElementById('pAddr').value,note:document.getElementById('pNote').value,teeth:{},visits:[],appts:[],payments:[],plan:[],privateNote:'',rating:''});save();alert(t('newPat'));render()}
function editPatient(i){let p=patients[i];let n=prompt(L('الاسم الجديد','New name'),p.name);if(n!=null&&n.trim())p.name=n.trim();let ph=prompt(L('الهاتف الجديد','New phone'),p.phone);if(ph!=null)p.phone=ph;save();render()}
function deletePatient(i){if(confirm(L('متأكدة تحذفي ','Are you sure delete ')+patients[i].name+' ؟')){patients.splice(i,1);sel=null;save();render()}}
document.addEventListener('click',()=>{document.querySelectorAll('.patientMenu.open').forEach(e=>e.classList.remove('open'))});
function openPatient(){page='patients';render();setTimeout(()=>{document.querySelector('#patientDetail')?.scrollIntoView({behavior:'smooth'})},100)}
function patientDetail(){let p=patients[sel];if(!p)return '';let teethHtml='';for(let i=11;i<=18;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=21;i<=28;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=31;i<=38;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=41;i<=48;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;return `<div class="card" id="patientDetail"><button class="btn2" onclick="sel=null;render()">${t('back')}</button><h2>${p.name} - ${p.phone}</h2><p class="label">${p.age} | ${p.gender} | ${p.addr} | ${p.note}</p><div style="text-align:center;background:#F7FBFF;padding:12px;border-radius:10px">${teethHtml}<p class="label">🔵 ${L('حشو','Filling')} | 🔴 ${L('خلع','Extraction')} | 🟡 ${L('محتاج علاج','Needs Treatment')} | ⚪ ${L('سليم','Healthy')}</p><p>${L('اضغطي على السنة لتغيير حالتها','Click tooth to change')}</p></div><div class="grid2"><div><h3>${t('visitHist')}</h3><textarea id="vText" placeholder="${t('whatDone')}"></textarea><button class="btn" onclick="addVisit()">${t('addVisit')}</button>${(p.visits||[]).map(v=>`<div style="border-bottom:1px solid #eee;padding:6px">${v.date} - ${v.text}</div>`).join('')}</div><div><h3>${t('plan')}</h3><textarea id="planText" placeholder="${t('plan')}"></textarea><button class="btn" onclick="addPlan()">${t('save')}</button>${(p.plan||[]).map(pl=>`<div>${pl.text} - ${pl.approved?L('✅ معتمد','Approved'):''} ${role=='doctor'?`<button class="btn2" onclick="approvePlan(${p.plan.indexOf(pl)})">${t('approve')}</button>`:''}</div>`).join('')}</div></div><div class="grid2"><div><h3>${t('invoices')}</h3><input id="payAmt" type="number" placeholder="${L('المبلغ','Amount')}"><input id="payNote" placeholder="${L('البيان','Note')}"><button class="btnG" onclick="addPay()">${t('recordPay')}</button>${(p.payments||[]).map(py=>`<div>${py.date} - ${py.amount} - ${py.note}</div>`).join('')}</div><div><h3>${t('privateNote')}</h3><textarea id="privNote" placeholder="${t('privateNote')}">${p.privateNote||''}</textarea>${role=='doctor'?`<button class="btn" onclick="savePrivate()">${t('save')}</button>`:`<p class="label">${L('الدكتور بس اللي يشوفها','Doctor only')}</p>`}<h3>${t('rating')}</h3><select id="rateSel"><option value="">${L('اختاري','Select')}</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select><button class="btn2" onclick="saveRating()">${t('save')}</button><p>${p.rating||''}</p></div></div></div>`}
function toggleTooth(n){let p=patients[sel];let cur=p.teeth[n]||'';let next=cur==''?'filling':cur=='filling'?'extraction':cur=='extraction'?'treatment':'';p.teeth[n]=next;save();render()}
function addVisit(){let p=patients[sel],tx=document.getElementById('vText').value;if(!tx)return;p.visits.push({date:todayStr(),text:tx});save();render()}
function addPlan(){let p=patients[sel],tx=document.getElementById('planText').value;if(!tx)return;p.plan.push({text:tx,approved:false});save();render()}
function approvePlan(i){patients[sel].plan[i].approved=true;save();render()}
function addPay(){let p=patients[sel],a=document.getElementById('payAmt').value;if(!a)return;p.payments.push({date:todayStr(),amount:a,note:document.getElementById('payNote').value});save();render()}
function savePrivate(){patients[sel].privateNote=document.getElementById('privNote').value;save();alert(L('اتحفظت','Saved'))}
function saveRating(){patients[sel].rating=document.getElementById('rateSel').value;save();render()}
</script>
<script>
function appointPage(){let all=[];patients.forEach((p,pi)=>{(p.appts||[]).forEach(a=>all.push({...a,pi:pi,name:p.name,phone:p.phone}))});all.sort((a,b)=>a.date.localeCompare(b.date));return `<div class="card"><h3>${t('newAppt')}</h3><select id="aPat">${patients.map((p,i)=>`<option value="${i}">${p.name} - ${p.phone}</option>`).join('')}</select><input id="aDate" type="date" value="${todayStr()}"><input id="aTime" type="time"><input id="aNote" placeholder="${L('ملاحظة','Note')}"><button class="btn" onclick="addAppt()">${t('save')}</button></div><div class="card"><h3>${t('appoint')}</h3>${all.map(a=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${a.date} ${a.time||''} - ${a.name}</b><span>${a.note||''} <button class="btn2" onclick="delAppt(${a.pi},'${a.date}','${a.time}')">❌</button></span></div>`).join('')||L('مفيش مواعيد','No appointments')}</div>`}
function addAppt(){let pi=document.getElementById('aPat').value;if(pi==''||!patients[pi])return;patients[pi].appts.push({date:document.getElementById('aDate').value,time:document.getElementById('aTime').value,note:document.getElementById('aNote').value});save();render()}
function delAppt(pi,d,ti){patients[pi].appts=patients[pi].appts.filter(a=>!(a.date==d&&a.time==ti));save();render()}
function stockPage(){let today=new Date();return `<div class="card"><h3>${t('addItem')}</h3><input id="sName" placeholder="${t('itemName')}"><input id="sQty" type="number" placeholder="${t('qty')}"><input id="sPrice" type="number" placeholder="${t('price')}"><input id="sExp" type="date"><input id="sAlert" type="number" placeholder="${t('alertQty')}"><button class="btn" onclick="addStock()">${t('add')}</button></div><div class="card"><h3>${t('current')}</h3><div class="tableWrap"><table><tr><th>${L('الصنف','Item')}</th><th>${t('qty')}</th><th>${t('expDate')}</th><th>${L('الحالة','Status')}</th><th></th><th></th></tr>${stock.map((s,i)=>{let isExp=s.exp&&new Date(s.exp)<today;let isLow=s.qty<=s.alert;return `<tr><td>${s.name}</td><td>${s.qty}</td><td>${s.exp||''} ${isExp?`<span class="exp">${L('منتهي','Expired')}</span>`:''}</td><td>${isLow?`<span class="low">${t('low')}</span>`:t('avail')}</td><td><button class="btn2" onclick="useStock(${i})">-1 ${t('used')}</button></td><td><button class="btn2" onclick="delStock(${i})">❌</button></td></tr>`}).join('')}</table></div></div>`}
function addStock(){let n=document.getElementById('sName').value;if(!n)return;stock.push({name:n,qty:+document.getElementById('sQty').value||0,price:+document.getElementById('sPrice').value||0,exp:document.getElementById('sExp').value,alert:+document.getElementById('sAlert').value||5});save();render()}
function useStock(i){if(stock[i].qty>0)stock[i].qty--;save();render()}
function delStock(i){stock.splice(i,1);save();render()}
function reportsPage(){if(role!='doctor'){alert(L('التقارير للدكتور بس','Reports for Doctor only'));page='home';render();return}let inc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);let ex=manualExps.reduce((s,e)=>s+(+e.amount||0),0)+stock.reduce((s,i)=>s+(+i.price||0),0);let pres=attendance.filter(a=>a.type=='in').length;return `<div class="card"><h3>${t('reportsTitle')}</h3><div class="grid3"><div class="card"><b>${L('الدخل','Income')}</b><h2>${inc}</h2></div><div class="card"><b>${L('المصاريف','Expenses')}</b><h2>${ex}</h2></div><div class="card"><b>${L('الصافي','Net')}</b><h2>${inc-ex}</h2></div></div><p>${L('عدد المرضى:','Patients:')} ${patients.length} | ${L('عدد الزيارات:','Visits:')} ${patients.reduce((s,p)=>s+(p.visits||[]).length,0)}</p></div><div class="card"><h3>${t('secAtt')}</h3><p>${t('present')}: ${pres} | ${t('rate')}: ${pres?Math.round(pres/30*100):0}%</p><button class="btn2" onclick="alert('${L('تم إرسال طلب الإجازة للدكتور','Vacation requested')}')">${t('vacation')}</button></div><div class="card"><h3>${t('manualExp')}</h3><input id="eAmt" type="number" placeholder="${L('المبلغ','Amount')}"><input id="eNote" placeholder="${L('البيان - إيجار / كهربا','Note')}"><button class="btn" onclick="addExp()">${t('save')}</button>${manualExps.map(e=>`<div>${e.date} - ${e.amount} - ${e.note}</div>`).join('')}</div><div class="card"><h3>${t('backup')}</h3><button class="btn" onclick="backup()">${L('تحميل نسخة احتياطية','Download Backup')}</button><input type="file" id="restoreFile" onchange="restore(event)"><p class="label">${L('اختاري ملف النسخة عشان ترجعيه','Choose backup file to restore')}</p></div>`}
function addExp(){let a=document.getElementById('eAmt').value;if(!a)return;manualExps.push({date:todayStr(),amount:a,note:document.getElementById('eNote').value});save();render()}
function backup(){let data={clinic:clinic,patients:patients,stock:stock,manualExps:manualExps,attendance:attendance,waitList:waitList,doctorId:DOCTOR_ID};let b=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='barakat-backup-'+DOCTOR_ID+'-'+todayStr()+'.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.patients)patients=d.patients;if(d.stock)stock=d.stock;if(d.manualExps)manualExps=d.manualExps;if(d.attendance)attendance=d.attendance;if(d.waitList)waitList=d.waitList;if(d.clinic)clinic=d.clinic;save();alert(L('تم استرجاع النسخة ✅','Restored'));render()}catch(err){alert(L('ملف غلط','Wrong file'))}};r.readAsText(f)}
function settingsPage(){return `<div class="card"><h3>${t('settings')}</h3><label class="label">اسم العيادة</label><input id="setName" value="${clinic.name}"><label class="label">اسم الدكتور</label><input id="setDoctor" value="${clinic.doctor}"><label class="label">التخصص</label><input id="setTitle" value="${clinic.doctorTitle}"><label class="label">اسم السكرتيرة</label><input id="setSec" value="${clinic.secName||''}"><label class="label">رقم سري الدكتور</label><input id="setPassDoc" value="${clinic.passDoc}"><label class="label">رقم سري السكرتيرة</label><input id="setPassSec" value="${clinic.passSec}"><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div><div class="card"><h3>لينك عيادتك</h3><input readonly value="${doctorLink(DOCTOR_ID)}" onclick="this.select()"><p class="label">ابعتي اللينك ده للدكتور والسكرتيرة</p></div>`}
function saveSettings(){clinic.name=document.getElementById('setName').value;clinic.doctor=document.getElementById('setDoctor').value;clinic.doctorTitle=document.getElementById('setTitle').value;clinic.secName=document.getElementById('setSec').value;clinic.passDoc=document.getElementById('setPassDoc').value;clinic.passSec=document.getElementById('setPassSec').value; myDoctor.passDoc=clinic.passDoc; myDoctor.passSec=clinic.passSec; save(); alert('اتحفظت ✅'); render();}
function waitingPage(){return `<div class="card"><h3>${t('waiting')}</h3><input id="wName" placeholder="اسم المريض"><input id="wPhone" placeholder="الهاتف"><button class="btn" onclick="addWait()">${t('save')}</button>${waitList.map((w,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${w.name} - ${w.phone}</b><button class="btn2" onclick="delWait(${i})">❌</button></div>`).join('')}</div>`}
function addWait(){let n=document.getElementById('wName').value; if(!n) return; waitList.push({name:n,phone:document.getElementById('wPhone').value}); save(); render();}
function delWait(i){waitList.splice(i,1); save(); render();}
function dailyClose(){let inc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0); alert('قفل اليوم\nالدخل: '+inc+'\nعدد المرضى: '+patients.length);}
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC_P2FTHIRdiK_F1z1Y7Qerlp14yqniFa4",authDomain:"buba-clinic-app.firebaseapp.com",projectId:"buba-clinic-app",storageBucket:"buba-clinic-app.firebasestorage.app",messagingSenderId:"403832309031",appId:"1:403832309031:web:907f24b74083224106e6"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
let oldSave=save;
let isLoadingFromCloud=false;
save=function(){oldSave();if(isLoadingFromCloud)return;try{db.collection("clinic_data").doc(DOCTOR_ID).set({clinic:clinic,patients:patients,stock:stock,manualExps:manualExps,attendance:attendance,waitList:waitList,doctorId:DOCTOR_ID,updatedAt:new Date().toISOString()}).catch(e=>console.log('cloud save error',e));patients.forEach(p=>{db.collection("patients").doc(DOCTOR_ID+"_"+String(p.id)).set({...p,doctorId:DOCTOR_ID}).catch(e=>console.log(e))})}catch(e){console.log(e)}};
try{ db.collection("doctors").doc(DOCTOR_ID).set({id:DOCTOR_ID,name:myDoctor.name,expiresAt:myDoctor.expiresAt,active:myDoctor.active,passDoc:myDoctor.passDoc,passSec:myDoctor.passSec,updatedAt:new Date().toISOString()},{merge:true}).catch(()=>{}); }catch(e){}
db.collection("clinic_data").doc(DOCTOR_ID).get().then(doc=>{if(doc.exists){let d=doc.data();if(d){isLoadingFromCloud=true;if(d.patients&&d.patients.length>0)patients=d.patients;if(d.stock)stock=d.stock;if(d.manualExps)manualExps=d.manualExps;if(d.attendance)attendance=d.attendance;if(d.waitList)waitList=d.waitList;if(d.clinic){clinic=d.clinic; if(myDoctor.passDoc) clinic.passDoc=myDoctor.passDoc; if(myDoctor.passSec) clinic.passSec=myDoctor.passSec;} localStorage.setItem(_docKey('patients'),JSON.stringify(patients));localStorage.setItem(_docKey('stock'),JSON.stringify(stock));localStorage.setItem(_docKey('exps'),JSON.stringify(manualExps));localStorage.setItem(_docKey('att'),JSON.stringify(attendance));localStorage.setItem(_docKey('wait'),JSON.stringify(waitList));localStorage.setItem(_docKey('clinic'),JSON.stringify(clinic));isLoadingFromCloud=false;render()}}else{db.collection("patients").where("doctorId","==",DOCTOR_ID).get().then(snap=>{if(!snap.empty){let arr=[];snap.forEach(x=>arr.push(x.data()));if(arr.length>0){patients=arr;localStorage.setItem(_docKey('patients'),JSON.stringify(patients));render()}}})}}).catch(e=>console.log(e));
db.collection("clinic_data").doc(DOCTOR_ID).onSnapshot(doc=>{if(!doc.exists)return;let d=doc.data();if(!d||isLoadingFromCloud)return;if(d.updatedAt&&d.patients){patients=d.patients;stock=d.stock||stock;manualExps=d.manualExps||manualExps;attendance=d.attendance||attendance;waitList=d.waitList||waitList;if(d.clinic){clinic=d.clinic; if(myDoctor.passDoc) clinic.passDoc=myDoctor.passDoc; if(myDoctor.passSec) clinic.passSec=myDoctor.passSec;} oldSave();render()}});
login();
</script>

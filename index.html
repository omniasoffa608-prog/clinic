<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عيادة بركات لطب الأسنان</title><style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#eef2f7;color:#0f172a}
header{background:#0b2a6b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.layout{display:flex;min-height:100vh}aside{width:230px;background:#0b2a6b;color:#fff;padding:14px;flex-shrink:0}
aside button{display:block;width:100%;background:transparent;border:0;color:#fff;padding:11px;border-radius:10px;cursor:pointer;font-size:15px;text-align:right}
aside button.active{background:#1e4fa3}main{flex:1;padding:14px;min-width:0}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px #0001}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0;background:#f8fafc}
.btn{background:#0b2a6b;color:#fff;border:0;padding:11px;border-radius:8px;width:100%;font-weight:700;cursor:pointer}
.btn2{background:#dbeafe;color:#0b2a6b;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.btnG{background:#16a34a;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eef2f7;text-align:right;font-size:14px;white-space:nowrap}.tableWrap{overflow-x:auto}
.tooth{width:42px;height:42px;border-radius:50%;border:2px solid #0b2a6b;background:#fff;cursor:pointer}.tooth.filling{background:#3b82f6;color:#fff}.tooth.extraction{background:#ef4444;color:#fff}.tooth.treatment{background:#f59e0b;color:#fff}
.label{font-size:12px;color:#64748b}.tag{padding:4px 8px;border-radius:20px;font-size:12px;background:#dcfce7}.low{color:#dc2626;font-weight:700}.exp{color:#dc2626;font-weight:700;background:#fee2e2;padding:4px 8px;border-radius:20px;font-size:12px}
@media(max-width:900px){aside{width:180px}.grid3,.grid2{grid-template-columns:1fr 1fr}.tooth{width:36px;height:36px}}
</style></head><body><div id="app"></div>
<script>
let lang='ar',role=null,page='home',sel=0;
let clinic=JSON.parse(localStorage.getItem('barakat_clinic')||'{"name":"عيادة بركات لطب الأسنان","doctor":"د. كريم بركات","doctorTitle":"أخصائي طب وجراحة الفم والأسنان","secName":"","passDoc":"12321","passSec":"2222"}');
let T={en:{dash:'Dashboard',patients:'Patients',appoint:'Appointments',stock:'Inventory',reports:'Reports',settings:'Settings',waiting:'Waiting List',logout:'Logout',today:'Today Patients',newAppt:'+ New Appointment',open:'Open File',checkIn:'Check In',checkOut:'Check Out',attTitle:'Attendance',addItem:'Add New Item',itemName:'Item name',qty:'Quantity',price:'Total Purchase Price',expDate:'Expiry Date',alertQty:'Alert when less than',add:'Add Item',current:'Current Stock',used:'Used',avail:'Available',low:'Almost Finished',back:'Back',visitHist:'Visit History',addVisit:'Add Visit',whatDone:'What was done?',plan:'Treatment Plan',approve:'Approve Plan',invoices:'Invoices',recordPay:'Record Payment',register:'Register Patient',name:'Name',phone:'Phone',save:'Save',searchOld:'Patient already exists!',openOld:'Open Old File',newPat:'New patient',reportsTitle:'Reports',secAtt:'Secretary Attendance',present:'Days Present',absent:'Days Absent',rate:'Attendance Rate',vacation:'Request Vacation',backup:'Backup',dailyClose:'Daily Closing',manualExp:'Manual Expense',whatsapp:'WhatsApp',privateNote:'Doctor Private Note',rating:'Patient Rating'},
ar:{dash:'لوحة التحكم',patients:'المرضى',appoint:'المواعيد',stock:'المخزون',reports:'التقارير',settings:'الإعدادات',waiting:'قائمة الانتظار',logout:'تسجيل الخروج',today:'مرضى اليوم',newAppt:'+ موعد جديد',open:'فتح الملف',checkIn:'✅ تسجيل الحضور',checkOut:'تسجيل الانصراف',attTitle:'الحضور والانصراف',addItem:'إضافة صنف جديد',itemName:'اسم الصنف - مثال: بنج',qty:'الكمية',price:'سعر الشراء الكلي',expDate:'تاريخ الانتهاء',alertQty:'تنبيه لما يقل عن',add:'إضافة صنف',current:'المخزون الحالي',used:'استخدمت',avail:'✅ متوفر',low:'⚠️ قرب يخلص',back:'رجوع',visitHist:'سجل الزيارات',addVisit:'إضافة زيارة',whatDone:'ما تم في الزيارة دي؟',plan:'خطة العلاج',approve:'اعتماد خطة العلاج',invoices:'الفواتير',recordPay:'تسجيل دفع',register:'تسجيل مريض',name:'الاسم',phone:'الهاتف',save:'حفظ',searchOld:'المريض موجود بالفعل!',openOld:'فتح ملفه القديم',newPat:'✅ مريض جديد',reportsTitle:'التقارير',secAtt:'حضور السكرتيرة',present:'يوم حضور',absent:'يوم غياب',rate:'نسبة الحضور',vacation:'طلب إجازة',backup:'نسخة احتياطية',dailyClose:'قفل اليوم',manualExp:'مصروف يدوي - إيجار / كهربا',whatsapp:'💬 واتساب',privateNote:'ملاحظات الدكتور الخاصة - الدكتور بس',rating:'تقييم المريض'}};
function t(k){return T[lang][k]||k}function L(a,e){return lang=='ar'?a:e}
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';render()}
let patients=JSON.parse(localStorage.getItem('barakat_patients')||'[]');
let stock=JSON.parse(localStorage.getItem('barakat_stock')||'[]');
let manualExps=JSON.parse(localStorage.getItem('barakat_exps')||'[]');
let attendance=JSON.parse(localStorage.getItem('barakat_att')||'[]');
let waitList=JSON.parse(localStorage.getItem('barakat_wait')||'[]');
function save(){localStorage.setItem('barakat_patients',JSON.stringify(patients));localStorage.setItem('barakat_stock',JSON.stringify(stock));localStorage.setItem('barakat_exps',JSON.stringify(manualExps));localStorage.setItem('barakat_wait',JSON.stringify(waitList));localStorage.setItem('barakat_att',JSON.stringify(attendance));localStorage.setItem('barakat_clinic',JSON.stringify(clinic))}
function login(){document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><div style="font-size:48px">🦷</div><h2>${clinic.name}</h2><h3 style="margin:0;color:#0b2a6b">${clinic.doctor}</h3><p class="label">${clinic.doctorTitle}</p><input id="pw" type="password" placeholder="${L('كلمة السر','Password')}"><button class="btn" onclick="check()">${L('دخول','Login')}</button><div style="display:flex;gap:6px;justify-content:center;margin-top:10px"><button class="btn2" onclick="lang='ar';login()">العربية</button><button class="btn2" onclick="lang='en';login()">English</button></div></div>`}
function check(){let v=document.getElementById('pw').value;if(v==clinic.passDoc){role='doctor';page='home';render()}else if(v==clinic.passSec){role='sec';page='home';render()}else alert(L('كلمة سر غلط','Wrong password'))}
function go(p){if(p=='settings'&&role!='doctor'){alert(L('الإعدادات للدكتور بس','Settings for Doctor only'));return}page=p;render()}
function menu(){let m=[['home',lang=='ar'?'🏠 الرئيسية':'🏠 Home'],['patients','👥 '+t('patients')],['appoint','📅 '+t('appoint')],['stock','📦 '+t('stock')]];if(role=='doctor')m.push(['reports','📊 '+t('reports')],['settings','⚙️ '+t('settings')]);m.push(['waiting','⏳ '+t('waiting')]);return m.map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+`<button onclick="role=null;login()">🚪 ${t('logout')}</button><div style="margin-top:10px;display:flex;gap:6px"><button class="btn2" onclick="setLang('ar')">عربي</button><button class="btn2" onclick="setLang('en')">EN</button></div>`}
  function render(){if(!role){login();return}document.getElementById('app').innerHTML=`<header><div><b>🦷 ${clinic.name}</b><br><small>${clinic.doctor} | ${role=='doctor'?L('دكتور','Doctor'):L('سكرتيرة','Secretary')}</small></div><div><button class="btn2" onclick="dailyClose()">💰 ${t('dailyClose')}</button></div></header><div class="layout"><aside>${menu()}</aside><main>${page=='home'?home():page=='patients'?patientsPage():page=='appoint'?appointPage():page=='stock'?stockPage():page=='reports'?reportsPage():page=='settings'?settingsPage():page=='waiting'?waitingPage():home()}</main></div>`}
function todayStr(){return new Date().toISOString().slice(0,10)}
function home(){let tod=patients.filter(p=>p.appts&&p.appts.some(a=>a.date==todayStr()));let totalInc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);let totalEx=manualExps.reduce((s,e)=>s+(+e.amount||0),0)+stock.reduce((s,i)=>s+(+i.price||0),0);return `<div class="card"><h2>${L('أهلاً','Welcome')} ${role=='doctor'?clinic.doctor:clinic.secName||L('سكرتيرة','Secretary')}</h2><p>${L('مرضى اليوم:','Today:')} ${tod.length} | ${L('إجمالي الدخل:','Total Income:')} ${totalInc} | ${L('إجمالي المصاريف:','Expenses:')} ${totalEx}</p><button class="btn" onclick="go('patients')">${t('newAppt')}</button></div><div class="card"><h3>${t('today')}</h3>${tod.length?tod.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${p.name}</b><button class="btn2" onclick="sel=patients.indexOf(patients.find(x=>x.id==${p.id}));page='patients';render()">${t('open')}</button></div>`).join(''):`<p class="label">${L('مفيش مرضى النهارده','No patients today')}</p>`}</div><div class="card"><h3>${t('attTitle')}</h3><button class="btn" onclick="checkIn()">${t('checkIn')}</button><button class="btn2" onclick="checkOut()" style="margin-top:6px;width:100%">${t('checkOut')}</button><div id="attMsg" style="margin-top:8px"></div></div>`}
function checkIn(){let d=todayStr();if(attendance.find(a=>a.date==d&&a.type=='in')){alert(L('سجلت حضور قبل كده','Already checked in'));return}attendance.push({date:d,type:'in',time:new Date().toLocaleTimeString()});save();alert(L('تم تسجيل الحضور ✅','Checked in'))}
function checkOut(){let d=todayStr();attendance.push({date:d,type:'out',time:new Date().toLocaleTimeString()});save();alert(L('تم تسجيل الانصراف','Checked out'))}
function patientsPage(){let q=document.getElementById('searchQ')?.value||'';let list=patients.filter(p=>p.name.includes(q)||p.phone.includes(q));return `<div class="card"><h3>${t('register')}</h3><input id="pName" placeholder="${t('name')}"><input id="pPhone" placeholder="${t('phone')}"><input id="pAge" placeholder="${L('السن','Age')}"><select id="pGender"><option>${L('ذكر','Male')}</option><option>${L('أنثى','Female')}</option></select><input id="pAddr" placeholder="${L('العنوان','Address')}"><input id="pNote" placeholder="${L('ملاحظات','Notes')}"><button class="btn" onclick="addPatient()">${t('save')}</button><div id="dupMsg"></div></div><div class="card"><input id="searchQ" placeholder="${L('ابحثي بالاسم أو الهاتف','Search')}" value="${q}" oninput="render()"><div class="tableWrap"><table><tr><th>${t('name')}</th><th>${t('phone')}</th><th></th><th></th></tr>${list.map((p,i)=>`<tr><td>${p.name}</td><td>${p.phone}</td><td><button class="btn2" onclick="sel=${patients.indexOf(p)};openPatient()">${t('open')}</button></td><td><a href="https://wa.me/${p.phone.replace(/[^0-9]/g,'')}" target="_blank"><button class="btn2">${t('whatsapp')}</button></a></td></tr>`).join('')}</table></div></div>${sel!=null&&patients[sel]?patientDetail():' '}`}
function addPatient(){let n=document.getElementById('pName').value.trim(),ph=document.getElementById('pPhone').value.trim();if(!n){alert(L('اكتبي الاسم','Enter name'));return}let ex=patients.find(p=>p.phone==ph&&ph);if(ex){document.getElementById('dupMsg').innerHTML=`<p style="color:red">${t('searchOld')}</p><button class="btn" onclick="sel=${patients.indexOf(ex)};openPatient()">${t('openOld')}</button>`;return}let id=Date.now();patients.push({id:id,name:n,phone:ph,age:document.getElementById('pAge').value,gender:document.getElementById('pGender').value,addr:document.getElementById('pAddr').value,note:document.getElementById('pNote').value,teeth:{},visits:[],appts:[],payments:[],plan:[],privateNote:'',rating:''});save();alert(t('newPat'));render()}
function openPatient(){page='patients';render();setTimeout(()=>{document.querySelector('#patientDetail')?.scrollIntoView({behavior:'smooth'})},100)}
function patientDetail(){let p=patients[sel];if(!p)return '';let teethHtml='';for(let i=11;i<=18;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=21;i<=28;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=31;i<=38;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;teethHtml+='<br><br>';for(let i=41;i<=48;i++)teethHtml+=`<button class="tooth ${p.teeth[i]||''}" onclick="toggleTooth(${i})">${i}</button>`;return `<div class="card" id="patientDetail"><button class="btn2" onclick="sel=null;render()">${t('back')}</button><h2>${p.name} - ${p.phone}</h2><p class="label">${p.age} | ${p.gender} | ${p.addr} | ${p.note}</p><div style="text-align:center;background:#f8fafc;padding:12px;border-radius:10px">${teethHtml}<p class="label">🔵 ${L('حشو','Filling')} | 🔴 ${L('خلع','Extraction')} | 🟡 ${L('محتاج علاج','Needs Treatment')} | ⚪ ${L('سليم','Healthy')}</p><p>${L('اضغطي على السنة لتغيير حالتها','Click tooth to change')}</p></div><div class="grid2"><div><h3>${t('visitHist')}</h3><textarea id="vText" placeholder="${t('whatDone')}"></textarea><button class="btn" onclick="addVisit()">${t('addVisit')}</button>${(p.visits||[]).map(v=>`<div style="border-bottom:1px solid #eee;padding:6px">${v.date} - ${v.text}</div>`).join('')}</div><div><h3>${t('plan')}</h3><textarea id="planText" placeholder="${t('plan')}"></textarea><button class="btn" onclick="addPlan()">${t('save')}</button>${(p.plan||[]).map(pl=>`<div>${pl.text} - ${pl.approved?L('✅ معتمد','Approved'):''} ${role=='doctor'?`<button class="btn2" onclick="approvePlan(${p.plan.indexOf(pl)})">${t('approve')}</button>`:''}</div>`).join('')}</div></div><div class="grid2"><div><h3>${t('invoices')}</h3><input id="payAmt" type="number" placeholder="${L('المبلغ','Amount')}"><input id="payNote" placeholder="${L('البيان','Note')}"><button class="btnG" onclick="addPay()">${t('recordPay')}</button>${(p.payments||[]).map(py=>`<div>${py.date} - ${py.amount} - ${py.note}</div>`).join('')}</div><div><h3>${t('privateNote')}</h3><textarea id="privNote" placeholder="${t('privateNote')}">${p.privateNote||''}</textarea>${role=='doctor'?`<button class="btn" onclick="savePrivate()">${t('save')}</button>`:`<p class="label">${L('الدكتور بس اللي يشوفها','Doctor only')}</p>`}<h3>${t('rating')}</h3><select id="rateSel"><option value="">${L('اختاري','Select')}</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select><button class="btn2" onclick="saveRating()">${t('save')}</button><p>${p.rating||''}</p></div></div></div>`}
function toggleTooth(n){let p=patients[sel];let cur=p.teeth[n]||'';let next=cur==''?'filling':cur=='filling'?'extraction':cur=='extraction'?'treatment':'';p.teeth[n]=next;save();render()}
function addVisit(){let p=patients[sel],tx=document.getElementById('vText').value;if(!tx)return;p.visits.push({date:todayStr(),text:tx});save();render()}
function addPlan(){let p=patients[sel],tx=document.getElementById('planText').value;if(!tx)return;p.plan.push({text:tx,approved:false});save();render()}
function approvePlan(i){patients[sel].plan[i].approved=true;save();render()}
function addPay(){let p=patients[sel],a=document.getElementById('payAmt').value;if(!a)return;p.payments.push({date:todayStr(),amount:a,note:document.getElementById('payNote').value});save();render()}
function savePrivate(){patients[sel].privateNote=document.getElementById('privNote').value;save();alert(L('اتحفظت','Saved'))}
function saveRating(){patients[sel].rating=document.getElementById('rateSel').value;save();render()}
  function appointPage(){let all=[];patients.forEach((p,pi)=>{(p.appts||[]).forEach(a=>all.push({...a,pi:pi,name:p.name,phone:p.phone}))});all.sort((a,b)=>a.date.localeCompare(b.date));return `<div class="card"><h3>${t('newAppt')}</h3><select id="aPat">${patients.map((p,i)=>`<option value="${i}">${p.name} - ${p.phone}</option>`).join('')}</select><input id="aDate" type="date" value="${todayStr()}"><input id="aTime" type="time"><input id="aNote" placeholder="${L('ملاحظة','Note')}"><button class="btn" onclick="addAppt()">${t('save')}</button></div><div class="card"><h3>${t('appoint')}</h3>${all.map(a=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${a.date} ${a.time||''} - ${a.name}</b><span>${a.note||''} <button class="btn2" onclick="delAppt(${a.pi},'${a.date}','${a.time}')">❌</button></span></div>`).join('')||L('مفيش مواعيد','No appointments')}</div>`}
function addAppt(){let pi=document.getElementById('aPat').value;patients[pi].appts.push({date:document.getElementById('aDate').value,time:document.getElementById('aTime').value,note:document.getElementById('aNote').value});save();render()}
function delAppt(pi,d,ti){patients[pi].appts=patients[pi].appts.filter(a=>!(a.date==d&&a.time==ti));save();render()}
function stockPage(){let today=new Date();return `<div class="card"><h3>${t('addItem')}</h3><input id="sName" placeholder="${t('itemName')}"><input id="sQty" type="number" placeholder="${t('qty')}"><input id="sPrice" type="number" placeholder="${t('price')}"><input id="sExp" type="date"><input id="sAlert" type="number" placeholder="${t('alertQty')}"><button class="btn" onclick="addStock()">${t('add')}</button></div><div class="card"><h3>${t('current')}</h3><div class="tableWrap"><table><tr><th>${L('الصنف','Item')}</th><th>${t('qty')}</th><th>${t('expDate')}</th><th>${L('الحالة','Status')}</th><th></th><th></th></tr>${stock.map((s,i)=>{let isExp=s.exp&&new Date(s.exp)<today;let isLow=s.qty<=s.alert;return `<tr><td>${s.name}</td><td>${s.qty}</td><td>${s.exp||''} ${isExp?`<span class="exp">${L('منتهي','Expired')}</span>`:''}</td><td>${isLow?`<span class="low">${t('low')}</span>`:t('avail')}</td><td><button class="btn2" onclick="useStock(${i})">-1 ${t('used')}</button></td><td><button class="btn2" onclick="delStock(${i})">❌</button></td></tr>`}).join('')}</table></div></div>`}
function addStock(){let n=document.getElementById('sName').value;if(!n)return;stock.push({name:n,qty:+document.getElementById('sQty').value||0,price:+document.getElementById('sPrice').value||0,exp:document.getElementById('sExp').value,alert:+document.getElementById('sAlert').value||5});save();render()}
function useStock(i){if(stock[i].qty>0)stock[i].qty--;save();render()}
function delStock(i){stock.splice(i,1);save();render()}
function reportsPage(){if(role!='doctor'){alert(L('التقارير للدكتور بس','Reports for Doctor only'));page='home';render();return}let inc=patients.reduce((s,p)=>s+(p.payments||[]).reduce((a,b)=>a+(+b.amount||0),0),0);let ex=manualExps.reduce((s,e)=>s+(+e.amount||0),0)+stock.reduce((s,i)=>s+(+i.price||0),0);let pres=attendance.filter(a=>a.type=='in').length;return `<div class="card"><h3>${t('reportsTitle')}</h3><div class="grid3"><div class="card"><b>${L('الدخل','Income')}</b><h2>${inc}</h2></div><div class="card"><b>${L('المصاريف','Expenses')}</b><h2>${ex}</h2></div><div class="card"><b>${L('الصافي','Net')}</b><h2>${inc-ex}</h2></div></div><p>${L('عدد المرضى:','Patients:')} ${patients.length} | ${L('عدد الزيارات:','Visits:')} ${patients.reduce((s,p)=>s+(p.visits||[]).length,0)}</p></div><div class="card"><h3>${t('secAtt')}</h3><p>${t('present')}: ${pres} | ${t('rate')}: ${pres?Math.round(pres/30*100):0}%</p><button class="btn2" onclick="alert('${L('تم إرسال طلب الإجازة للدكتور','Vacation requested')}')">${t('vacation')}</button></div><div class="card"><h3>${t('manualExp')}</h3><input id="eAmt" type="number" placeholder="${L('المبلغ','Amount')}"><input id="eNote" placeholder="${L('البيان - إيجار / كهربا','Note')}"><button class="btn" onclick="addExp()">${t('save')}</button>${manualExps.map(e=>`<div>${e.date} - ${e.amount} - ${e.note}</div>`).join('')}</div><div class="card"><h3>${t('backup')}</h3><button class="btn" onclick="backup()">${L('تحميل نسخة احتياطية','Download Backup')}</button><input type="file" id="restoreFile" onchange="restore(event)"><p class="label">${L('ارفعي ملف النسخة هنا عشان ترجعي البيانات','Upload backup to restore')}</p></div>`}
function addExp(){let a=document.getElementById('eAmt').value;if(!a)return;manualExps.push({date:todayStr(),amount:a,note:document.getElementById('eNote').value});save();render()}
function backup(){let data=JSON.stringify({patients,stock,manualExps,attendance,waitList,clinic});let b=new Blob([data],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='clinic-backup.json';a.click()}
function restore(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);patients=d.patients||[];stock=d.stock||[];manualExps=d.manualExps||[];attendance=d.attendance||[];waitList=d.waitList||[];clinic=d.clinic||clinic;save();alert(L('تم استرجاع البيانات','Restored'));render()};r.readAsText(f)}
function settingsPage(){if(role!='doctor'){alert(L('الإعدادات للدكتور بس','Settings for Doctor only'));return}return `<div class="card"><h3>⚙️ ${t('settings')} - ${L('الدكتور بس','Doctor Only')}</h3><label>${L('اسم العيادة','Clinic Name')}</label><input id="cName" value="${clinic.name}"><label>${L('اسم الدكتور','Doctor Name')}</label><input id="cDoc" value="${clinic.doctor}"><label>${L('تخصص الدكتور','Doctor Title')}</label><input id="cTitle" value="${clinic.doctorTitle}"><label>${L('اسم السكرتيرة','Secretary Name')}</label><input id="cSec" value="${clinic.secName||''}"><label>${L('باسورد الدكتور','Doctor Password')}</label><input id="cPassDoc" value="${clinic.passDoc}"><label>${L('باسورد السكرتيرة','Secretary Password')}</label><input id="cPassSec" value="${clinic.passSec}"><button class="btn" onclick="saveSettings()">${t('save')}</button></div>`}
function saveSettings(){clinic.name=document.getElementById('cName').value;clinic.doctor=document.getElementById('cDoc').value;clinic.doctorTitle=document.getElementById('cTitle').value;clinic.secName=document.getElementById('cSec').value;clinic.passDoc=document.getElementById('cPassDoc').value;clinic.passSec=document.getElementById('cPassSec').value;save();alert(L('اتحفظت ✅','Saved'));render()}
function waitingPage(){return `<div class="card"><h3>⏳ ${t('waiting')}</h3><input id="wName" placeholder="${t('name')}"><input id="wPhone" placeholder="${t('phone')}"><button class="btn" onclick="addWait()">${t('save')}</button></div><div class="card">${waitList.map((w,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><b>${w.name} - ${w.phone}</b><button class="btn2" onclick="delWait(${i})">❌</button></div>`).join('')||L('القايمة فاضية','Empty')}</div>`}
function addWait(){let n=document.getElementById('wName').value;if(!n)return;waitList.push({name:n,phone:document.getElementById('wPhone').value,date:todayStr()});save();render()}
function delWait(i){waitList.splice(i,1);save();render()}
function dailyClose(){let inc=patients.reduce((s,p)=>s+(p.payments||[]).filter(py=>py.date==todayStr()).reduce((a,b)=>a+(+b.amount||0),0),0);alert(L('قفل اليوم: دخل النهارده ','Daily Close: Today Income ')+inc)}
login();
</script></body></html>
